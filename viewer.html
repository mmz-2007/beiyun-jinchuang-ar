<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北韵晋创 · 3D 自由查看模式</title>

  <!-- three.js（用 importmap 方式加载，CDN 免费开源） -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body { margin: 0; overflow: hidden; font-family: "PingFang SC","Microsoft YaHei",sans-serif; background: #101418; }
    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(16,20,24,0.85); color: #fff;
      padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 50;
      max-width: 92%; text-align: center; transition: opacity 0.3s;
    }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; gap: 8px; padding: 12px 12px 0; justify-content: center; flex-wrap: wrap;
    }
    #bar a, #bar button {
      background: rgba(30,38,46,0.92); color: #e8e2d4; border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 14px; border-radius: 999px; font-size: 13px; text-decoration: none; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #bar a:active, #bar button:active { background: #d4a24e; color: #101418; }

    /* 产品切换条：点谁看谁 */
    #prod-bar {
      position: fixed; top: 56px; left: 0; right: 0; z-index: 60;
      display: flex; gap: 8px; padding: 8px 12px; justify-content: center; flex-wrap: wrap;
    }
    #prod-bar button {
      background: rgba(30,38,46,0.92); color: #e8e2d4; border: 1px solid rgba(255,255,255,0.15);
      padding: 7px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer; backdrop-filter: blur(6px);
    }
    #prod-bar button.active { background: #d4a24e; color: #101418; border-color: #d4a24e; font-weight: 600; }

    #loading {
      position: fixed; inset: 0; background: #101418; color: #e8e2d4; z-index: 100;
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }

    /* ============================================================
       ★ v1.6 新增：底部产品信息面板（与 AR 扫描版同款）
       ============================================================ */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      background: rgba(16, 20, 24, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212,162,78,0.45);
      border-radius: 20px 20px 0 0;
      padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform 0.45s cubic-bezier(0.22, 0.9, 0.32, 1);
      max-height: 42vh; overflow-y: auto;
    }
    #panel.show { transform: translateY(0); }
    #panel .grabber {
      width: 42px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.25); margin: 0 auto 8px; cursor: pointer;
    }
    #panel .p-brand {
      font-size: 11px; letter-spacing: 3px; color: #d4a24e;
      text-align: center; margin-bottom: 5px;
    }
    #panel .p-name {
      font-size: 19px; font-weight: 700; color: #f5f0e6;
      text-align: center; margin-bottom: 4px;
    }
    #panel .p-tag {
      display: block; width: fit-content; margin: 0 auto 8px;
      font-size: 11px; color: #d4a24e; background: rgba(212,162,78,0.14);
      border: 1px solid rgba(212,162,78,0.35);
      padding: 2px 10px; border-radius: 999px;
    }
    #panel .p-brief {
      font-size: 13px; color: #c8cdd4; line-height: 1.75;
      text-align: justify; margin-bottom: 6px;
    }
    #panel .p-desc {
      font-size: 13px; color: #9aa2ab; line-height: 1.75;
      text-align: justify; display: none;
      border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 8px; margin-top: 4px;
    }
    #panel .p-desc.show { display: block; }
    #panel .p-btns {
      display: flex; gap: 10px; margin-top: 10px; justify-content: center;
    }
    #panel .p-btns button {
      flex: 1; max-width: 200px;
      background: rgba(212,162,78,0.16); color: #d4a24e;
      border: 1px solid rgba(212,162,78,0.5);
      padding: 10px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
    }
    #panel .p-btns button:active { background: #d4a24e; color: #101418; }
    #panel .p-btns button.playing {
      background: #d4a24e; color: #101418;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,78,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(212,162,78,0); }
    }

    /* ★ v1.6：积木颗粒浮动装饰 */
    #deco {
      position: fixed; inset: 0; z-index: 40;
      pointer-events: none; overflow: hidden;
      opacity: 1;
    }
    #deco .brick {
      position: absolute; bottom: -60px;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.22; }
      85%  { opacity: 0.22; }
      100% { transform: translateY(-115vh) rotate(340deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="loading">⏳ 正在加载 3D 模型…</div>

  <div id="bar">
    <a href="./index.html">📷 返回 AR 扫描</a>
    <button id="btn-rotate">🔄 自动旋转：开</button>
    <button id="btn-reset">🎯 复位视角</button>
    <button id="btn-info">ℹ️ 产品介绍</button>
  </div>

  <!-- 产品切换条：点谁看谁（由代码自动生成按钮） -->
  <div id="prod-bar"></div>

  <div id="hint">单指旋转 · 双指缩放/平移 · 点上方按钮切换产品</div>

  <!-- v1.6：产品信息面板 -->
  <div id="panel">
    <div class="grabber" id="p-grabber" title="点击收起/展开"></div>
    <div class="p-brand">北 韵 晋 创 · 文 化 积 木</div>
    <div class="p-name" id="p-name">产品名称</div>
    <div class="p-tag" id="p-tag">主题标签</div>
    <div class="p-brief" id="p-brief">产品简介</div>
    <div class="p-desc" id="p-desc">详细介绍</div>
    <div class="p-btns">
      <button id="btn-voice">🔊 语音介绍</button>
      <button id="btn-more">查看更多 ⌄</button>
    </div>
  </div>

  <!-- v1.6：积木颗粒浮动装饰 -->
  <div id="deco" aria-hidden="true"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================
    // ★★★ v1.6 产品配置（与 index.html 的 PRODUCT_INFO 保持一致）★★★
    //   name  —— 产品名（按钮文字 + 面板标题）
    //   tag   —— 主题标签 / brief —— 一句话简介
    //   desc  —— 详细介绍（查看更多）/ voice —— 兜底语音文案（浏览器 TTS 朗读）
    //
    // ★ 语音文件（推荐）：录好的 MP3 放 assets/audio/audio_NN.mp3
    //   （编号 = 产品编号），微信内置浏览器也能播放；没有 MP3 自动降级 TTS
    // 顺序必须和 AR 扫描模式（index.html）里的 targetIndex 一一对应
    // ============================================================
    const PRODUCTS = [
      { name: '大同积木字', file: './assets/model_01.glb', tag: '古都 · 云冈',
        brief: '橙黄积木拼出「大同」，北魏古都握在掌心。',

        voice: '大同积木字，一百零五块积木，三色拼出「大同」，红圆片如朝霞。' },
      { name: '关帝庙积木字', file: './assets/model_02.glb', tag: '古建 · 信义',
        brief: '绿底「关帝庙」三字，朱红小印点睛。',
        desc: '159 颗积木，绿底白字拼出「关帝庙」，右上嵌「解州」朱红小印，再现关公故里匾额。',
        voice: '关帝庙积木字，一百五十九块积木，绿底白字三字，配「解州」朱红小印。' },
      { name: '介休积木字', file: './assets/model_03.glb', tag: '琉璃 · 后土',
        brief: '橙底白字「介休」，琉璃之乡入积木。',
        desc: '取介休琉璃脊饰之意，109 颗积木，橙黄底拼出「介休」，左上红圆点如琉璃珠。',
        voice: '介休积木字，一百零九块积木，橙黄底白字，红圆点如琉璃珠。' },
      { name: '晋祠积木字', file: './assets/model_04.glb', tag: '古建 · 宋韵',
        brief: '绿底金黄「晋祠」，千年古祠气派。',
        desc: '以晋祠匾额为原型，149 颗积木，绿底金字，顶上红圆片如圣母殿红墙。',
        voice: '晋祠积木字，一百四十九块积木，绿底金字「晋祠」，红圆片如红墙。' },
      { name: '临汾积木字', file: './assets/model_05.glb', tag: '表里 · 汾河',
        brief: '橙底白字「临汾」，表里山河入掌心。',
        desc: '取「表里山河」之意，172 颗积木，橙底白字拼出「临汾」，红圆点如汾河鼓灯。',
        voice: '临汾积木字，一百七十二块积木，橙底白字「临汾」，红点如汾河鼓灯。' },
      { name: '魁星楼冰箱贴', file: './assets/model_06.glb', tag: '古建 · 多层檐',
        brief: '三层飞檐小楼，魁星阁贴上冰箱。',
        desc: '仿晋祠魁星楼造型，100 颗积木，三层飞檐橙红小楼，顶上金黄宝珠，磁吸底。',
        voice: '魁星楼冰箱贴，一百块积木，三层飞檐小楼，金黄宝顶，磁吸底。' },
      { name: '水镜台冰箱贴', file: './assets/model_07.glb', tag: '古建 · 关帝庙',
        brief: '关帝庙古戏台立面，黄檐双鼓。',
        desc: '取解州关帝庙水镜台戏台立面，42 颗积木，黄檐橙身悬两面大鼓，磁吸背板。',
        voice: '水镜台冰箱贴，四十二块积木，黄檐双鼓古戏台，磁吸背板。' },
      { name: '地铁一号线', file: './assets/model_08.glb', tag: '太原 · Line 1',
        brief: '太原地铁 1 号线站牌柱，A 出口太原站。',
        desc: '59 颗积木，26 厘米高黄色站牌柱：太原地铁标志、A 出口山西省太原站、Line 1 入口标识。',
        voice: '地铁一号线积木，五十九块积木，黄色站牌立柱，太原地铁 Line 1 入口。' },
      { name: '迎泽大桥积木冰箱贴', file: './assets/model_09.glb', tag: '太原 · 迎泽',
        brief: '迎泽桥塔造型，红色塔顶灯。',
        desc: '仿迎泽大桥主塔，95 颗积木，三层浅米色塔身，深色立柱象征主缆，红色塔顶灯，磁吸底。',
        voice: '迎泽大桥冰箱贴，九十五块积木，三层塔身配红色塔顶灯，磁吸底。' },
      { name: '迎泽大桥积木摆件', file: './assets/model_10.glb', tag: '太原 · 迎泽',
        brief: '桥塔造型放大 18 厘米，桌面镇件。',
        desc: '与冰箱贴同源造型放大至 18 厘米，157 颗积木，直立式底座，玄关办公桌皆可陈列。',
        voice: '迎泽大桥摆件，一百五十七块积木，十八厘米桥塔，直立式底座。' },
      { name: '迫击炮（基础版）', file: './assets/model_11.glb', tag: '军事 · 主题',
        brief: '深绿迫击炮+两名操作兵，入门款。',
        desc: '1:43 军事入门款，78 颗积木：深绿迫击炮居中，两名操作兵分列左右，灰色底盘前置两颗炮弹。',
        voice: '迫击炮基础版，七十八块积木，深绿迫击炮加两名操作兵，前置两颗炮弹。' },
      { name: '迫击炮（升级版）', file: './assets/model_12.glb', tag: '军事 · 主题',
        brief: '浅绿迫击炮+红星弹药箱，进阶款。',
        desc: '1:43 进阶款，106 颗积木：浅绿迫击炮扬角更大，木质弹药箱嵌黄边红五角星，黑色底座。',
        voice: '迫击炮升级版，一百零六块积木，浅绿迫击炮配红星弹药箱。' },
      { name: '龙鹤福', file: './assets/model_13.glb', tag: '传统纹样 · 福字',
        brief: '红黄龙鹤纹样，吉祥福字摆件。',
        desc: '取「龙鹤福」吉祥纹样，57 颗积木：中心红圆主纹，四向延伸红黄龙鹤件，直径约 12 厘米。',
        voice: '龙鹤福摆件，五十七块积木，中心红圆，四向红黄龙鹤，吉祥纹样。' },
    ];

    // ---------- 场景基础 ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101418);

    const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.01, 100);
    camera.position.set(0, 1.4, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    // ---------- 灯光（让积木颜色好看） ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2));
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key);
    const fill = new THREE.DirectionalLight(0xffeecc, 0.6); fill.position.set(-4, 2, -3); scene.add(fill);

    // ---------- 轨道控制器：单指旋转 / 双指缩放平移 ----------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.2, 0);
    controls.minDistance = 0.8;
    controls.maxDistance = 12;

    const DEFAULT_CAM = new THREE.Vector3(0, 1.4, 3.2);
    const loader = new GLTFLoader();
    const cache = {};        // 已加载的模型缓存：{ idx: THREE.Group }
    const loadingEl = document.getElementById('loading');
    let currentIdx = -1;

    // ============================================================
    // v1.6：信息面板 + 语音播报
    // ============================================================
    const panel = document.getElementById('panel');
    const pName = document.getElementById('p-name');
    const pTag = document.getElementById('p-tag');
    const pBrief = document.getElementById('p-brief');
    const pDesc = document.getElementById('p-desc');
    const btnVoice = document.getElementById('btn-voice');
    const btnMore = document.getElementById('btn-more');
    const btnInfo = document.getElementById('btn-info');
    const grabber = document.getElementById('p-grabber');
    const hintEl = document.getElementById('hint');
    let panelOpen = true;
    let voicePlaying = false;

    function showPanel(idx) {
      const p = PRODUCTS[idx];
      if (!p) return;
      pName.textContent = p.name;
      pTag.textContent = p.tag || '';
      pBrief.textContent = p.brief || '';
      pDesc.textContent = p.desc || '';
      pDesc.classList.remove('show');
      btnMore.textContent = '查看更多 ⌄';
      panel.classList.add('show');
      panelOpen = true;
      hintEl.style.opacity = '0';
    }

    function hidePanel() {
      panel.classList.remove('show');
      panelOpen = false;
      stopVoice();
      hintEl.style.opacity = '1';
    }

    // 「产品介绍」按钮 / grabber 点击：切换显隐
    btnInfo.addEventListener('click', () => {
      if (panelOpen) hidePanel(); else showPanel(currentIdx === -1 ? 0 : currentIdx);
    });
    grabber.addEventListener('click', () => {
      if (panelOpen) hidePanel(); else showPanel(currentIdx === -1 ? 0 : currentIdx);
    });

    // ---- 语音播报：MP3 文件优先（微信可用），浏览器 TTS 兜底 ----
    // 语音文件放 assets/audio/audio_NN.mp3（编号 = 产品编号）
    let audioEl = null;        // HTML5 Audio 实例
    let fallbackDone = false;  // 是否已尝试过 TTS 兜底（防止重复触发）

    function stopVoice() {
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '🔊 语音介绍';
      if (audioEl) {
        try { audioEl.pause(); audioEl.currentTime = 0; } catch (e) {}
        audioEl = null;
      }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    }

    // MP3 加载/播放失败时：尝试浏览器 TTS；微信里 TTS 也不可用则提示
    function fallbackTTS(text) {
      if (fallbackDone) return;
      fallbackDone = true;
      if ('speechSynthesis' in window) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = 0.95;
          u.onend = () => stopVoice();
          u.onerror = () => stopVoice();
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
          return;   // TTS 接管成功，保持播放状态
        } catch (e) {}
      }
      // MP3 和 TTS 都不可用（典型：微信内置浏览器且没放语音文件）
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '⚠️ 语音文件未配置';
      setTimeout(() => { btnVoice.textContent = '🔊 语音介绍'; }, 2500);
    }

    btnVoice.addEventListener('click', () => {
      if (voicePlaying) { stopVoice(); return; }
      const p = PRODUCTS[currentIdx === -1 ? 0 : currentIdx];
      if (!p || !p.voice) return;

      // 优先播 assets/audio/audio_NN.mp3（点击即用户手势，微信允许播放）
      const nn = String((currentIdx === -1 ? 0 : currentIdx) + 1).padStart(2, '0');
      fallbackDone = false;
      voicePlaying = true;
      btnVoice.classList.add('playing');
      btnVoice.textContent = '⏹ 停止播放';

      audioEl = new Audio('./assets/audio/audio_' + nn + '.mp3');
      audioEl.onended = () => stopVoice();
      audioEl.onerror = () => fallbackTTS(p.voice);
      audioEl.play().catch(() => {
        // play() 被拒（非 404 场景）也走兜底；404 时 onerror 已处理
        if (audioEl) fallbackTTS(p.voice);
      });
    });

    // ---- 查看更多 ----
    btnMore.addEventListener('click', () => {
      const open = pDesc.classList.toggle('show');
      btnMore.textContent = open ? '收起介绍 ⌃' : '查看更多 ⌄';
    });

    // ---- 积木颗粒浮动装饰 ----
    (function buildDeco() {
      const deco = document.getElementById('deco');
      const colors = ['#d4a24e', '#b3473a', '#4a7d8c', '#c77b3b'];
      const specs = [
        { left: '6%',  size: 40, dur: 15, delay: 0 },
        { left: '24%', size: 30, dur: 19, delay: 3.5 },
        { left: '46%', size: 48, dur: 13, delay: 1.5 },
        { left: '68%', size: 32, dur: 21, delay: 6 },
        { left: '84%', size: 42, dur: 16, delay: 4 },
        { left: '55%', size: 26, dur: 24, delay: 8 },
      ];
      specs.forEach((s, i) => {
        const c = colors[i % colors.length];
        const el = document.createElement('div');
        el.className = 'brick';
        el.style.left = s.left;
        el.style.animationDuration = s.dur + 's';
        el.style.animationDelay = s.delay + 's';
        el.innerHTML =
          '<svg width="' + s.size + '" height="' + Math.round(s.size * 0.62) + '" viewBox="0 0 64 40">' +
          '<rect x="1" y="1" width="62" height="38" rx="7" fill="' + c + '" fill-opacity="0.9" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>' +
          '<circle cx="19" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="45" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="17" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '<circle cx="43" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '</svg>';
        deco.appendChild(el);
      });
    })();

    // ---------- 加载并归一化模型（自动缩放居中、落地） ----------
    function loadModel(idx, onDone) {
      loadingEl.style.display = 'flex';
      loadingEl.textContent = '⏳ 正在加载「' + PRODUCTS[idx].name + '」…';
      loader.load(PRODUCTS[idx].file, (gltf) => {
        const root = gltf.scene;

        // 自动归一化：不管模型原始多大，统一缩放到画面合适大小并居中、贴地
        const box = new THREE.Box3().setFromObject(root);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const s = 2.2 / maxDim;
        root.scale.setScalar(s);
        root.position.set(-center.x*s, -box.min.y*s, -center.z*s);

        cache[idx] = root;
        scene.add(root);
        onDone && onDone();
      }, undefined, () => {
        loadingEl.textContent = '❌ 「' + PRODUCTS[idx].name + '」加载失败，请检查 ' + PRODUCTS[idx].file + ' 是否存在';
        setTimeout(() => { loadingEl.style.display = 'none'; }, 2500);
      });
    }

    // ---------- 切换产品（v1.6：同步更新信息面板 + 停止语音） ----------
    function showProduct(idx) {
      if (idx === currentIdx) return;
      // 先隐藏当前模型
      if (currentIdx !== -1 && cache[currentIdx]) cache[currentIdx].visible = false;
      currentIdx = idx;

      // v1.6：切换产品时更新面板、停止上一段语音
      stopVoice();
      showPanel(idx);

      if (cache[idx]) {
        // 之前加载过：直接显示，秒切
        cache[idx].visible = true;
        loadingEl.style.display = 'none';
        updateButtons();
        return;
      }
      updateButtons();
      loadModel(idx, () => { loadingEl.style.display = 'none'; });
    }

    // ---------- 生成产品按钮 ----------
    const prodBar = document.getElementById('prod-bar');
    const prodBtns = [];
    PRODUCTS.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.textContent = p.name;
      btn.addEventListener('click', () => showProduct(i));
      prodBar.appendChild(btn);
      prodBtns.push(btn);
    });
    function updateButtons() {
      prodBtns.forEach((b, i) => b.classList.toggle('active', i === currentIdx));
    }

    // 默认显示第 1 个产品
    showProduct(0);

    // ---------- 自动旋转开关 ----------
    let autoRotate = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2.0;
    document.getElementById('btn-rotate').addEventListener('click', (e) => {
      autoRotate = !autoRotate;
      controls.autoRotate = autoRotate;
      e.target.textContent = autoRotate ? '🔄 自动旋转：开' : '⏸ 自动旋转：关';
    });

    // ---------- 复位视角 ----------
    document.getElementById('btn-reset').addEventListener('click', () => {
      camera.position.copy(DEFAULT_CAM);
      controls.target.set(0, 0.2, 0);
    });

    // ---------- 渲染循环 ----------
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>

</body>
</html>
