<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北韵晋创 · 文化积木智造 AR 演示</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #101418; color: #e8e2d4; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 16px;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(16,20,24,0.88); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      z-index: 50; max-width: 90%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.3s;
    }
    #hint.tracked { background: rgba(47,125,74,0.92); }
    #hint.locked { background: rgba(212,162,78,0.95); color: #101418; }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; gap: 8px; padding: 12px 12px 0; justify-content: center; flex-wrap: wrap;
    }
    #bar a, #bar button {
      background: rgba(30,38,46,0.92); color: #e8e2d4; border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 14px; border-radius: 999px; font-size: 13px; text-decoration: none; cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #bar a:active, #bar button:active { background: #d4a24e; color: #101418; }
    #bar button.on { background: #d4a24e; color: #101418; border-color: #d4a24e; }

    /* ============================================================
       ★ v1.6 新增：底部产品信息面板（Bottom Sheet）
       ============================================================ */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      background: rgba(16, 20, 24, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212,162,78,0.45);
      border-radius: 20px 20px 0 0;
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform 0.45s cubic-bezier(0.22, 0.9, 0.32, 1);
      max-height: 46vh; overflow-y: auto;
    }
    #panel.show { transform: translateY(0); }
    #panel .grabber {
      width: 42px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.25); margin: 0 auto 10px;
    }
    #panel .p-brand {
      font-size: 11px; letter-spacing: 3px; color: #d4a24e;
      text-align: center; margin-bottom: 6px;
    }
    #panel .p-name {
      font-size: 20px; font-weight: 700; color: #f5f0e6;
      text-align: center; margin-bottom: 4px;
    }
    #panel .p-tag {
      display: block; width: fit-content; margin: 0 auto 10px;
      font-size: 11px; color: #d4a24e; background: rgba(212,162,78,0.14);
      border: 1px solid rgba(212,162,78,0.35);
      padding: 2px 10px; border-radius: 999px;
    }
    #panel .p-brief {
      font-size: 13px; color: #c8cdd4; line-height: 1.75;
      text-align: justify; margin-bottom: 6px;
    }
    #panel .p-desc {
      font-size: 13px; color: #9aa2ab; line-height: 1.75;
      text-align: justify; display: none;
      border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 8px; margin-top: 4px;
    }
    #panel .p-desc.show { display: block; }
    #panel .p-btns {
      display: flex; gap: 10px; margin-top: 12px; justify-content: center;
    }
    #panel .p-btns button {
      flex: 1; max-width: 200px;
      background: rgba(212,162,78,0.16); color: #d4a24e;
      border: 1px solid rgba(212,162,78,0.5);
      padding: 10px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
    }
    #panel .p-btns button:active { background: #d4a24e; color: #101418; }
    #panel .p-btns button.playing {
      background: #d4a24e; color: #101418;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,78,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(212,162,78,0); }
    }

    /* ============================================================
       ★ v1.6 新增：积木主题浮动装饰（山西·积木颗粒缓缓上浮）
       ============================================================ */
    #deco {
      position: fixed; inset: 0; z-index: 40;
      pointer-events: none; overflow: hidden;
      opacity: 0; transition: opacity 1.2s;
    }
    #deco.show { opacity: 1; }
    #deco .brick {
      position: absolute; bottom: -60px;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.28; }
      85%  { opacity: 0.28; }
      100% { transform: translateY(-115vh) rotate(340deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- 加载动画 -->
  <div id="loading">⏳ 正在加载 AR 引擎…</div>

  <!-- 顶部操作条 -->
  <div id="bar">
    <button id="btn-lock">🔓 锁定（移开图不消失）</button>
    <a href="./viewer.html">🖥 自由查看模式</a>
  </div>

  <!-- 底部提示条 -->
  <div id="hint">📷 将手机摄像头对准任意产品图</div>

  <!-- v1.6：产品信息面板（识别到产品后从底部滑出） -->
  <div id="panel">
    <div class="grabber"></div>
    <div class="p-brand">北 韵 晋 创 · 文 化 积 木</div>
    <div class="p-name" id="p-name">产品名称</div>
    <div class="p-tag" id="p-tag">主题标签</div>
    <div class="p-brief" id="p-brief">产品简介</div>
    <div class="p-desc" id="p-desc">详细介绍</div>
    <div class="p-btns">
      <button id="btn-voice">🔊 语音介绍</button>
      <button id="btn-more">查看更多 ⌄</button>
    </div>
  </div>

  <!-- v1.6：积木颗粒浮动装饰 -->
  <div id="deco" aria-hidden="true"></div>

  <!--
    ============================================================
    ★★★ 多产品配置说明 ★★★

    ① 追踪文件 assets/targets.mind
       - 把你的所有产品图（建议 3~5 张）一次性拖到 MindAR 编译器：
         https://hiukim.github.io/mind-ar-js-doc/tools/compile
       - 编译得到 targets.mind，放到 assets/ 下
       - 图片在编译器里的**顺序** = 下面的 targetIndex 序号

    ② 3D 模型（和编译器里的图片顺序一一对应）
       - model_01.glb → targetIndex: 0（编译器里第 1 张图）
       - 以此类推
  -->

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 1; filterMinCF: 0.1; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 预加载所有模型（有几款产品就加几条） -->
    <a-assets>

      <a-asset-item id="model-01" src="./assets/model_01.glb"></a-asset-item>
      <a-asset-item id="model-02" src="./assets/model_02.glb"></a-asset-item>
      <a-asset-item id="model-03" src="./assets/model_03.glb"></a-asset-item>
      <a-asset-item id="model-04" src="./assets/model_04.glb"></a-asset-item>
      <a-asset-item id="model-05" src="./assets/model_05.glb"></a-asset-item>
      <a-asset-item id="model-06" src="./assets/model_06.glb"></a-asset-item>
      <a-asset-item id="model-07" src="./assets/model_07.glb"></a-asset-item>
      <a-asset-item id="model-08" src="./assets/model_08.glb"></a-asset-item>
      <a-asset-item id="model-09" src="./assets/model_09.glb"></a-asset-item>
      <a-asset-item id="model-10" src="./assets/model_10.glb"></a-asset-item>
      <a-asset-item id="model-11" src="./assets/model_11.glb"></a-asset-item>
      <a-asset-item id="model-12" src="./assets/model_12.glb"></a-asset-item>
      <a-asset-item id="model-13" src="./assets/model_13.glb"></a-asset-item>

    </a-assets>

    <!-- ========== 产品 1：targetIndex 0 ========== -->
    <a-entity id="anchor-0" mindar-image-target="targetIndex: 0">
      <a-entity id="modelwrap-0" gltf-model="#model-01" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 2：targetIndex 1 ========== -->
    <a-entity id="anchor-1" mindar-image-target="targetIndex: 1">
      <a-entity id="modelwrap-1" gltf-model="#model-02" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 3：targetIndex 2 ========== -->
    <a-entity id="anchor-2" mindar-image-target="targetIndex: 2">
      <a-entity id="modelwrap-2" gltf-model="#model-03" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 4：targetIndex 3 ========== -->
    <a-entity id="anchor-3" mindar-image-target="targetIndex: 3">
      <a-entity id="modelwrap-3" gltf-model="#model-04" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 5：targetIndex 4 ========== -->
    <a-entity id="anchor-4" mindar-image-target="targetIndex: 4">
      <a-entity id="modelwrap-4" gltf-model="#model-05" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 6：targetIndex 5 ========== -->
    <a-entity id="anchor-5" mindar-image-target="targetIndex: 5">
      <a-entity id="modelwrap-5" gltf-model="#model-06" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 7：targetIndex 6 ========== -->
    <a-entity id="anchor-6" mindar-image-target="targetIndex: 6">
      <a-entity id="modelwrap-6" gltf-model="#model-07" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 8：targetIndex 7 ========== -->
    <a-entity id="anchor-7" mindar-image-target="targetIndex: 7">
      <a-entity id="modelwrap-7" gltf-model="#model-08" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 9：targetIndex 8 ========== -->
    <a-entity id="anchor-8" mindar-image-target="targetIndex: 8">
      <a-entity id="modelwrap-8" gltf-model="#model-09" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 10：targetIndex 9 ========== -->
    <a-entity id="anchor-9" mindar-image-target="targetIndex: 9">
      <a-entity id="modelwrap-9" gltf-model="#model-10" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 11：targetIndex 10 ========== -->
    <a-entity id="anchor-10" mindar-image-target="targetIndex: 10">
      <a-entity id="modelwrap-10" gltf-model="#model-11" scale="0.8 0.8 0.8" position="0 -0.1 0">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>

  <script>
    // ============================================================
    // ★★★ v1.6 产品信息配置区 ★★★
    //
    // 杰哥往这里填文案就行，格式说明：
    //   name  —— 产品名（面板大标题）
    //   tag   —— 主题标签（产品名下面的小胶囊，如「古建·辽金」）
    //   brief —— 一句话简介（面板默认显示）
    //   desc  —— 详细介绍（点「查看更多」展开）
    //   voice —— 兜底语音文案（没有对应 MP3 时，用浏览器 TTS 朗读这段）
    //
    // ★ 语音文件（推荐）：把录制好的 MP3 放到 assets/audio/ 文件夹，
    //   命名 audio_01.mp3 ~ audio_13.mp3（编号 = 产品编号），
    //   微信内置浏览器也能正常播放。没有 MP3 时自动降级用浏览器朗读。
    //
    // 注意：顺序必须和 targets.mind 里的图片顺序一致！
    // ============================================================
    const PRODUCT_INFO = [
      { name: '大同积木字', tag: '古都 · 云冈',

      { name: '关帝庙积木字', tag: '古建 · 信义',

        voice: '关帝庙积木字，两百八十颗粒件铺出「关帝庙」三字，绿色为底白色为字，右上一颗「解州」朱红小印，再现关公故里山门匾额。' },
      { name: '介休积木字', tag: '琉璃 · 后土',
        brief: '橙底白字「介休」——琉璃之乡，凝固在三寸积木里。',
        desc: '灵感取自介休后土祠的琉璃脊饰，橙色与金黄积木交错成底，「介」「休」二字由白色零件逐颗拼出，左上缀一颗红色圆片作琉璃珠意象。210 颗粒件，可作摆件或拆作夹物。',

        voice: '晋祠积木字，两百四十颗粒件拼出「晋」「祠」二字，绿色为底金色为字，源自晋祠博物馆匾额，顶上一颗红圆片如圣母殿红墙。' },
      { name: '临汾积木字', tag: '表里 · 汾河',
        brief: '橙底白字「临汾」，把汾河岸的表里山河收进掌心。',

      { name: '魁星楼冰箱贴', tag: '古建 · 多层檐',

      { name: '地铁一号线', tag: '太原 · Line 1',

        desc: '整块积木高约 26 厘米，模拟太原地铁 1 号线入口站牌柱：上端「太原地铁」标志，下接黄色立柱标注「A 山西省太原站 SHANXITAIZHANSHI」「1 号线 Line 1」「入口 Entrance」三个区块，蓝色色带分块清晰。可摆玄关作钥匙架，或拆作桌签。',
        voice: '地铁一号线积木，二十六厘米高立柱，黄色主调，自上而下：太原地铁标志、A 出口山西省太原站、地铁 Line 1、入口标识。' },
      { name: '迎泽大桥积木冰箱贴', tag: '太原 · 迎泽',
        brief: '太原迎泽大桥主塔造型，三层塔身+红色塔顶，磁吸上冰箱。',
        desc: '仿太原迎泽大桥主塔剪影：三层浅米色塔身由下至上收分，中段两道深色立柱象征桥塔主缆，顶层方形框架中央嵌一颗红色圆片作塔顶标志灯。整体厚约 4 厘米，磁吸底，可贴冰箱、文件柜、白板。',
        voice: '迎泽大桥积木冰箱贴，仿迎泽大桥主塔造型，三层浅米色塔身，两道深色立柱象征主缆，顶端一颗红色塔顶灯，磁吸底设计。' },
      { name: '迎泽大桥积木摆件', tag: '太原 · 迎泽',
        brief: '同款迎泽桥塔造型加大尺寸，作桌面摆件更显气势。',
        desc: '与冰箱贴同源的迎泽大桥主塔造型，尺寸放大至约 18 厘米高，底座加深加大，三层塔身+深色立柱+红色塔顶灯俱全，无磁吸改为直立式。玄关、办公桌、电视柜旁皆可陈列，是迎泽大桥主题系列的镇桌之作。',
        voice: '迎泽大桥积木摆件，迎泽桥塔造型放大至十八厘米，浅米色塔身加深色立柱与红色塔顶灯，直立式底座，玄关办公桌皆宜。' },
      { name: '迫击炮（基础版）', tag: '军事 · 主题',
        brief: '深绿迫击炮+两名操作兵，灰色底盘作主场，入门军事积木。',
        desc: '1:43 比例军事题材入门款：一门深绿色迫击炮居中，炮口朝左上方扬起，左右各一名深绿军装小人偶——左手拿望远镜、右手持弹药；底盘为灰色圆角矩形带颗粒凸点，前侧两颗炮弹待发。整组约 380 颗粒件，可拆可合。',
        voice: '迫击炮基础版，三百八十颗粒件，深绿色炮一门、两名操作兵、灰色圆角底盘、前置两颗炮弹，入门款军事主题。' },
      { name: '迫击炮（升级版）', tag: '军事 · 主题',
        brief: '浅绿迫击炮+木质弹药箱带红星，升级款军事主题套装。',
        desc: '1:43 比例军事题材进阶款——浅绿色迫击炮置于右侧，炮管扬角更大；左侧放置一只木质弹药箱，箱面正中嵌一颗黄边红五角星；旁边一颗深绿炮弹备用。黑色长方形底座，整组约 460 颗粒件，零件数与造型复杂度同步升级。',
        voice: '迫击炮升级版，四百六十颗粒件，浅绿迫击炮一门、木质弹药箱带红星、备用深绿炮弹一颗，黑色长方形底座。' },
      { name: '龙鹤福', tag: '传统纹样 · 福字',
        brief: '红黄双色的「龙鹤福」纹样花形，传统吉祥图案的复刻摆件。',
        desc: '取传统「龙鹤福」吉祥纹样作俯视造型：中心一颗红色大圆作主纹，四周四向延伸出四组龙首鹤身红黄组合件，角端各嵌黄色圆片作点缀。直径约 12 厘米，可作茶席压杯、博古架小摆，或两两对陈作门厅点缀。',
        voice: '龙鹤福积木摆件，直径十二厘米，中心红圆，四向延伸红黄龙鹤组合件，角端缀黄圆片，传统吉祥纹样俯视造型。' },
    ];

    const TOTAL = 13;         // ← 改这里：你有几款产品就写几
    const sceneEl = document.querySelector('a-scene');
    const loading = document.getElementById('loading');
    const hint = document.getElementById('hint');
    const btnLock = document.getElementById('btn-lock');

    // ============================================================
    // v1.6：信息面板 + 语音播报
    // ============================================================
    const panel = document.getElementById('panel');
    const pName = document.getElementById('p-name');
    const pTag = document.getElementById('p-tag');
    const pBrief = document.getElementById('p-brief');
    const pDesc = document.getElementById('p-desc');
    const btnVoice = document.getElementById('btn-voice');
    const btnMore = document.getElementById('btn-more');
    const deco = document.getElementById('deco');

    let panelTarget = -1;     // 当前面板显示的是哪个产品
    let voicePlaying = false;

    function showPanel(i) {
      const p = PRODUCT_INFO[i] || { name: '产品 ' + (i + 1), tag: '', brief: '', desc: '', voice: '' };
      panelTarget = i;
      pName.textContent = p.name;
      pTag.textContent = p.tag;
      pBrief.textContent = p.brief;
      pDesc.textContent = p.desc;
      pDesc.classList.remove('show');
      btnMore.textContent = '查看更多 ⌄';
      panel.classList.add('show');
      deco.classList.add('show');
      hint.style.opacity = '0';      // 面板出现时隐藏底部提示条，避免重叠
    }

    function hidePanel() {
      panelTarget = -1;
      panel.classList.remove('show');
      deco.classList.remove('show');
      stopVoice();
      hint.style.opacity = '1';
    }

    // ---- 语音播报：MP3 文件优先（微信可用），浏览器 TTS 兜底 ----
    let audioEl = null;        // HTML5 Audio 实例
    let fallbackDone = false;  // 是否已尝试过 TTS 兜底（防止重复触发）

    function stopVoice() {
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '🔊 语音介绍';
      if (audioEl) {
        try { audioEl.pause(); audioEl.currentTime = 0; } catch (e) {}
        audioEl = null;
      }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    }

    // MP3 加载/播放失败时：尝试浏览器 TTS；微信里 TTS 也不可用则提示
    function fallbackTTS(text) {
      if (fallbackDone) return;
      fallbackDone = true;
      if ('speechSynthesis' in window) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = 0.95;      // 语速稍慢，播报更从容
          u.onend = () => stopVoice();
          u.onerror = () => stopVoice();
          window.speechSynthesis.cancel();   // 先清掉可能残留的任务
          window.speechSynthesis.speak(u);
          return;   // TTS 接管成功，保持播放状态
        } catch (e) {}
      }
      // 到这一步说明 MP3 和 TTS 都不可用（典型：微信内置浏览器）
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '⚠️ 语音文件未配置';
      setTimeout(() => { btnVoice.textContent = '🔊 语音介绍'; }, 2500);
    }

    btnVoice.addEventListener('click', () => {
      if (voicePlaying) { stopVoice(); return; }      // 播放中点击 = 停止
      const p = PRODUCT_INFO[panelTarget];
      if (!p || !p.voice) return;

      // 优先播 assets/audio/audio_NN.mp3（点击即用户手势，微信允许播放）
      const nn = String(panelTarget + 1).padStart(2, '0');
      fallbackDone = false;
      voicePlaying = true;
      btnVoice.classList.add('playing');
      btnVoice.textContent = '⏹ 停止播放';

      audioEl = new Audio('./assets/audio/audio_' + nn + '.mp3');
      audioEl.onended = () => stopVoice();
      audioEl.onerror = () => fallbackTTS(p.voice);
      audioEl.play().catch(() => {
        // play() 被拒（非 404 场景）也走兜底；404 时 onerror 已处理
        if (audioEl) fallbackTTS(p.voice);
      });
    });

    // ---- 查看更多（展开详细介绍） ----
    btnMore.addEventListener('click', () => {
      const open = pDesc.classList.toggle('show');
      btnMore.textContent = open ? '收起介绍 ⌃' : '查看更多 ⌄';
    });

    // ---- 生成积木颗粒浮动装饰（山西·积木主题） ----
    (function buildDeco() {
      // 四色积木：晋韵金 / 三晋红 / 汾河青 / 黄土橙
      const colors = ['#d4a24e', '#b3473a', '#4a7d8c', '#c77b3b'];
      const specs = [
        { left: '6%',  size: 40, dur: 15, delay: 0 },
        { left: '24%', size: 30, dur: 19, delay: 3.5 },
        { left: '46%', size: 48, dur: 13, delay: 1.5 },
        { left: '68%', size: 32, dur: 21, delay: 6 },
        { left: '84%', size: 42, dur: 16, delay: 4 },
        { left: '55%', size: 26, dur: 24, delay: 8 },
      ];
      specs.forEach((s, i) => {
        const c = colors[i % colors.length];
        const el = document.createElement('div');
        el.className = 'brick';
        el.style.left = s.left;
        el.style.animationDuration = s.dur + 's';
        el.style.animationDelay = s.delay + 's';
        // 2 凸点积木条 SVG（Studio 积木顶面造型）
        el.innerHTML =
          '<svg width="' + s.size + '" height="' + Math.round(s.size * 0.62) + '" viewBox="0 0 64 40">' +
          '<rect x="1" y="1" width="62" height="38" rx="7" fill="' + c + '" fill-opacity="0.9" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>' +
          '<circle cx="19" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="45" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="17" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '<circle cx="43" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '</svg>';
        deco.appendChild(el);
      });
    })();

    window.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hidden'), 3000);
    });

    // ============================================================
    // 锁定模式（支持多产品，每个产品独立锁定）
    // ============================================================
    let locked = false;
    let activeTarget = -1;      // 当前识别到的是哪个产品（-1 = 无）
    let placedTarget = -1;      // 哪个产品的模型被 detach 到屏幕固定位置
    let hasFoundOnce = false;

    const anchors = [], modelwraps = [];
    for (let i = 0; i < TOTAL; i++) {
      anchors[i] = document.getElementById('anchor-' + i);
      modelwraps[i] = document.getElementById('modelwrap-' + i);
    }

    const HOME_POS = { x: 0, y: -0.1, z: 0 };
    const HOME_SCALE = { x: 0.8, y: 0.8, z: 0.8 };
    const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();

    function detachModel(idx) {
      const m = modelwraps[idx];
      if (!m || !m.object3D) return;
      const o = m.object3D;
      if (o.parent === sceneEl.object3D) return;  // 已经在场景根了
      o.getWorldPosition(wp); o.getWorldQuaternion(wq); o.getWorldScale(ws);
      sceneEl.object3D.add(o);
      o.position.copy(wp); o.quaternion.copy(wq); o.scale.copy(ws);
      o.visible = true;
    }

    function attachModel(idx) {
      const m = modelwraps[idx];
      if (!m || !m.object3D) return;
      const o = m.object3D;
      if (o.parent === anchors[idx].object3D) return;  // 已经在锚点里了
      anchors[idx].object3D.add(o);
      o.position.set(HOME_POS.x, HOME_POS.y, HOME_POS.z);
      o.quaternion.identity();
      o.scale.set(HOME_SCALE.x, HOME_SCALE.y, HOME_SCALE.z);
    }

    // 给每个锚点绑定事件
    for (let i = 0; i < TOTAL; i++) {
      anchors[i].addEventListener('targetFound', () => {
        activeTarget = i;
        hasFoundOnce = true;

        // 如果当前有别的模型被 placed，先把它收回锚点（避免屏幕上有多个 detached 模型）
        if (!locked && placedTarget !== -1 && placedTarget !== i) {
          attachModel(placedTarget);
          placedTarget = -1;
        }

        // v1.6：识别到产品 → 弹出信息面板 + 换产品时停止上一段语音
        stopVoice();
        showPanel(i);

        if (locked) {
          // 锁定模式下：把当前识别到的模型也 detach 到屏幕
          detachModel(i);
          placedTarget = i;
          hint.textContent = '🔒 已锁定：单指旋转 · 双指缩放 · 移开图也不消失';
          hint.classList.add('locked'); hint.classList.remove('tracked');
        } else {
          hint.textContent = '✅ 已识别「' + (PRODUCT_INFO[i] && PRODUCT_INFO[i].name ? PRODUCT_INFO[i].name : '产品 ' + (i + 1)) + '」！点上方「锁定」可固定模型';
          hint.classList.add('tracked'); hint.classList.remove('locked');
        }
      });

      anchors[i].addEventListener('targetLost', () => {
        if (activeTarget !== i) return;  // 不是当前活跃的，忽略
        activeTarget = -1;

        if (locked && hasFoundOnce) {
          detachModel(i);
          placedTarget = i;
          hint.textContent = '🔒 模型已锁定在屏幕上：单指旋转 · 双指缩放';
          hint.classList.add('locked'); hint.classList.remove('tracked');
          // 锁定模式：模型和面板都留在屏幕上，不收起
        } else {
          hidePanel();
          hint.textContent = '📷 将手机摄像头对准任意产品图';
          hint.classList.remove('tracked', 'locked');
        }
      });
    }

    // 锁定开关
    btnLock.addEventListener('click', () => {
      locked = !locked;
      btnLock.textContent = locked ? '🔒 已锁定（点此解锁）' : '🔓 锁定（移开图不消失）';
      btnLock.classList.toggle('on', locked);

      if (locked) {
        // 锁定：把当前活跃的产品模型 detach 到屏幕
        if (activeTarget !== -1) {
          detachModel(activeTarget);
          placedTarget = activeTarget;
        }
        hint.textContent = '🔒 模型已锁定在屏幕上：单指旋转 · 双指缩放';
        hint.classList.add('locked'); hint.classList.remove('tracked');
      } else {
        // 解锁：把 placed 的模型收回锚点
        if (placedTarget !== -1) {
          attachModel(placedTarget);
          placedTarget = -1;
        }
        // 解锁且当前没有识别到目标 → 面板也收起
        if (activeTarget === -1) hidePanel();
        hint.textContent = '🔓 已解锁，模型跟随追踪图移动';
        hint.classList.remove('locked');
      }
    });

    // ============================================================
    // 手势：单指滑动 = 360° 旋转（上下左右全向无死角）；双指捏合 = 缩放
    // 只对 placedTarget（锁定在屏幕上的模型）生效
    // ============================================================
    let tLast = null, pinchLast = 0;
    function touchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    // 鼠标拖动支持（电脑/平板看效果）
    let mouseDrag = false, mouseLast = null;
    document.addEventListener('mousedown', (e) => {
      if (placedTarget === -1) return;
      // 点在面板和按钮上时不触发旋转
      if (e.target.closest && (e.target.closest('#panel') || e.target.closest('#bar'))) return;
      mouseDrag = true;
      mouseLast = { x: e.clientX, y: e.clientY };
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseDrag || placedTarget === -1) return;
      const o = modelwraps[placedTarget].object3D;
      if (!o || !mouseLast) return;
      const dx = e.clientX - mouseLast.x;
      const dy = e.clientY - mouseLast.y;
      o.rotation.y += dx * 0.01;
      o.rotation.x += dy * 0.01;   // 上下全向 360° 自由旋转
      mouseLast = { x: e.clientX, y: e.clientY };
    });
    document.addEventListener('mouseup', () => { mouseDrag = false; mouseLast = null; });

    document.addEventListener('touchstart', (e) => {
      if (placedTarget === -1) return;
      // 面板上的触摸（滚动看介绍）不参与旋转
      if (e.target.closest && e.target.closest('#panel')) return;
      if (e.touches.length === 1) tLast = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY
      };
      if (e.touches.length === 2) pinchLast = touchDist(e);
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (placedTarget === -1) return;
      if (e.target.closest && e.target.closest('#panel')) return;   // 面板内手势放行
      const o = modelwraps[placedTarget].object3D;
      if (!o) return;
      if (e.touches.length === 1 && tLast !== null) {
        const dx = e.touches[0].clientX - tLast.x;
        const dy = e.touches[0].clientY - tLast.y;
        o.rotation.y += dx * 0.01;                                  // 左右 → 绕 Y 轴
        o.rotation.x += dy * 0.01;                                  // 上下 → 绕 X 轴（360° 全向）
        tLast = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      } else if (e.touches.length === 2 && pinchLast > 0) {
        const d = touchDist(e);
        const k = Math.min(3, Math.max(0.2, o.scale.x * (d / pinchLast)));
        o.scale.setScalar(k);
        pinchLast = d;
      }
    }, { passive: true });
    document.addEventListener('touchend', () => { tLast = null; pinchLast = 0; }, { passive: true });
  </script>
