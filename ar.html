<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北韵晋创 · AR 扫描识别</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(160deg, #0e1116 0%, #1a2030 50%, #0e1116 100%);
      color: #e8e2d4; z-index: 100;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 16px;
      transition: opacity 0.6s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .load-logo {
      width: 120px; max-width: 60%; margin-bottom: 20px;
      background: rgba(245,240,230,0.95); border-radius: 14px; padding: 8px 12px;
      box-shadow: 0 6px 32px rgba(212,162,78,0.2);
      animation: logoBreath 2s ease-in-out infinite;
    }
    #loading .load-logo img { width: 100%; display: block; }
    @keyframes logoBreath {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    #loading .load-bricks {
      display: flex; gap: 6px; margin-bottom: 16px;
    }
    #loading .load-bricks span {
      display: block; width: 12px; height: 12px; border-radius: 3px;
      animation: brickJump 1.2s ease-in-out infinite;
    }
    #loading .load-bricks span:nth-child(1) { background: #d4a24e; animation-delay: 0s; }
    #loading .load-bricks span:nth-child(2) { background: #c8392e; animation-delay: 0.15s; }
    #loading .load-bricks span:nth-child(3) { background: #2a6e3f; animation-delay: 0.3s; }
    #loading .load-bricks span:nth-child(4) { background: #1e5b8a; animation-delay: 0.45s; }
    #loading .load-bricks span:nth-child(5) { background: #e8c878; animation-delay: 0.6s; }
    @keyframes brickJump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-14px); }
      60% { transform: translateY(-14px); }
    }
    #loading .load-text {
      font-size: 15px; letter-spacing: 4px; color: #d4a24e; opacity: 0.9;
      animation: textPulse 1.5s ease-in-out infinite;
    }
    @keyframes textPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(16,20,24,0.88); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px;
      z-index: 50; max-width: 90%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: opacity 0.3s;
    }
    #hint.tracked { background: rgba(47,125,74,0.92); }
    #hint.locked { background: rgba(212,162,78,0.95); color: #101418; }
    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; gap: 6px; padding: 10px 10px 0; justify-content: center; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #bar::-webkit-scrollbar { display: none; }
    #bar a, #bar button {
      flex-shrink: 0;
      background: rgba(30,38,46,0.92); color: #e8e2d4; border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 12px; border-radius: 999px; font-size: 13px; text-decoration: none; cursor: pointer;
      backdrop-filter: blur(6px); white-space: nowrap;
    }
    #bar a:active, #bar button:active { background: #d4a24e; color: #101418; }
    #bar button.on { background: #d4a24e; color: #101418; border-color: #d4a24e; }

    /* ============================================================
       ★ v1.6 新增：底部产品信息面板（Bottom Sheet）
       ============================================================ */
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
      background: rgba(16, 20, 24, 0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212,162,78,0.45);
      border-radius: 20px 20px 0 0;
      padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
      transform: translateY(110%);
      transition: transform 0.45s cubic-bezier(0.22, 0.9, 0.32, 1);
      max-height: 46vh; overflow-y: auto;
    }
    #panel.show { transform: translateY(0); }
    #panel .grabber {
      width: 42px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.25); margin: 0 auto 10px;
    }
    #panel .p-brand {
      font-size: 11px; letter-spacing: 3px; color: #d4a24e;
      text-align: center; margin-bottom: 6px;
    }
    #panel .p-name {
      font-size: 20px; font-weight: 700; color: #f5f0e6;
      text-align: center; margin-bottom: 4px;
    }
    #panel .p-tag {
      display: block; width: fit-content; margin: 0 auto 10px;
      font-size: 11px; color: #d4a24e; background: rgba(212,162,78,0.14);
      border: 1px solid rgba(212,162,78,0.35);
      padding: 2px 10px; border-radius: 999px;
    }
    #panel .p-brief {
      font-size: 13px; color: #c8cdd4; line-height: 1.75;
      text-align: justify; margin-bottom: 6px;
    }
    #panel .p-desc {
      font-size: 13px; color: #9aa2ab; line-height: 1.75;
      text-align: justify; display: none;
      border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 8px; margin-top: 4px;
    }
    #panel .p-desc.show { display: block; }
    #panel .p-btns {
      display: flex; gap: 10px; margin-top: 12px; justify-content: center;
    }
    #panel .p-btns button {
      flex: 1; max-width: 200px;
      background: rgba(212,162,78,0.16); color: #d4a24e;
      border: 1px solid rgba(212,162,78,0.5);
      padding: 10px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
      cursor: pointer;
    }
    #panel .p-btns button:active { background: #d4a24e; color: #101418; }
    #panel .p-btns button.playing {
      background: #d4a24e; color: #101418;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(212,162,78,0.5); }
      50% { box-shadow: 0 0 0 8px rgba(212,162,78,0); }
    }
    .logo-badge {
      position: fixed; bottom: 16px; right: 16px; z-index: 55;
      background: rgba(245,240,230,0.92); border-radius: 10px; padding: 4px 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3); pointer-events: none;
      max-width: 90px; opacity: 0.7; transition: opacity 0.3s;
    }
    .logo-badge:hover { opacity: 1; }
    .logo-badge img { width: 100%; display: block; }

    /* ============================================================
       ★ v1.6 新增：积木主题浮动装饰（山西·积木颗粒缓缓上浮）
       ============================================================ */
    #deco {
      position: fixed; inset: 0; z-index: 40;
      pointer-events: none; overflow: hidden;
      opacity: 0; transition: opacity 1.2s;
    }
    #deco.show { opacity: 1; }
    #deco .brick {
      position: absolute; bottom: -60px;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
      8%   { opacity: 0.28; }
      85%  { opacity: 0.28; }
      100% { transform: translateY(-115vh) rotate(340deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- v1.9 品牌化加载动画 -->
  <div id="loading">
    <div class="load-logo"><img src="./assets/logo.png" alt="北韵晋创"></div>
    <div class="load-bricks">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="load-text">正在寻找晋韵…</div>
  </div>

  <!-- 顶部操作条 -->
  <div id="bar">
    <a href="./index.html">🏠 首页</a>
    <button id="btn-lock">🔓 锁定</button>
    <button id="btn-upload">🖼 上传图片</button>
    <a href="./viewer.html">🖥 3D查看</a>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <!-- 底部提示条 -->
  <div id="hint">📷 将手机摄像头对准任意产品图</div>

  <!-- v1.6：产品信息面板（识别到产品后从底部滑出） -->
  <div id="panel">
    <div class="grabber"></div>
    <div class="p-brand">北 韵 晋 创 · 文 化 积 木</div>
    <div class="p-name" id="p-name">产品名称</div>
    <div class="p-tag" id="p-tag">主题标签</div>
    <div class="p-brief" id="p-brief">产品简介</div>
    <div class="p-desc" id="p-desc">详细介绍</div>
    <div class="p-btns">
      <button id="btn-voice">🔊 语音介绍</button>
      <button id="btn-share">📸 分享</button>
      <button id="btn-more">查看更多 ⌄</button>
    </div>
  </div>

  <!-- v1.6：积木颗粒浮动装饰 -->
  <div id="deco" aria-hidden="true"></div>

  <!-- v1.8.1：logo 水印 -->
  <div class="logo-badge"><img src="./assets/logo.png" alt="北韵晋创"></div>

  <!--
    ============================================================
    ★★★ 多产品配置说明 ★★★

    ① 追踪文件 assets/targets.mind
       - 把你的所有产品图（建议 3~5 张）一次性拖到 MindAR 编译器：
         https://hiukim.github.io/mind-ar-js-doc/tools/compile
       - 编译得到 targets.mind，放到 assets/ 下
       - 图片在编译器里的**顺序** = 下面的 targetIndex 序号

    ② 3D 模型（和编译器里的图片顺序一一对应）
       - model_01.glb → targetIndex: 0（编译器里第 1 张图）
       - 以此类推
  -->

  <a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 3; filterMinCF: 0.1; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" id="ar-scene" loading-screen="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-cursor
        fuse="false"
        raycaster="objects: [data-clickable]; far: 10000"
        id="cursor"
        visible="true"
        material="color: #d4a24e; shader: flat"
        geometry="radiusInner: 0.005; radiusOuter: 0.01; segments: 24; primitive: ring"
        position="0 0 -1"
        scale="2 2 2"
      ></a-cursor>
    </a-camera>

    <!-- 预加载所有模型（有几款产品就加几条） -->
    <a-assets>

      <a-asset-item id="model-01" src="./assets/model_01.glb"></a-asset-item>
      <a-asset-item id="model-02" src="./assets/model_02.glb"></a-asset-item>
      <a-asset-item id="model-03" src="./assets/model_03.glb"></a-asset-item>
      <a-asset-item id="model-04" src="./assets/model_04.glb"></a-asset-item>
      <a-asset-item id="model-05" src="./assets/model_05.glb"></a-asset-item>
      <a-asset-item id="model-06" src="./assets/model_06.glb"></a-asset-item>
      <a-asset-item id="model-07" src="./assets/model_07.glb"></a-asset-item>
      <a-asset-item id="model-08" src="./assets/model_08.glb"></a-asset-item>
      <a-asset-item id="model-09" src="./assets/model_09.glb"></a-asset-item>
      <a-asset-item id="model-10" src="./assets/model_10.glb"></a-asset-item>
      <a-asset-item id="model-11" src="./assets/model_11.glb"></a-asset-item>
      <a-asset-item id="model-12" src="./assets/model_12.glb"></a-asset-item>
      <a-asset-item id="model-13" src="./assets/model_13.glb"></a-asset-item>

    </a-assets>

    <!-- ========== 产品 1：targetIndex 0 ========== -->
    <a-entity id="anchor-0" mindar-image-target="targetIndex: 0">
      <a-entity id="modelwrap-0" gltf-model="#model-01" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="0" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 2：targetIndex 1 ========== -->
    <a-entity id="anchor-1" mindar-image-target="targetIndex: 1">
      <a-entity id="modelwrap-1" gltf-model="#model-02" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="1" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 3：targetIndex 2 ========== -->
    <a-entity id="anchor-2" mindar-image-target="targetIndex: 2">
      <a-entity id="modelwrap-2" gltf-model="#model-03" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="2" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 4：targetIndex 3 ========== -->
    <a-entity id="anchor-3" mindar-image-target="targetIndex: 3">
      <a-entity id="modelwrap-3" gltf-model="#model-04" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="3" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 5：targetIndex 4 ========== -->
    <a-entity id="anchor-4" mindar-image-target="targetIndex: 4">
      <a-entity id="modelwrap-4" gltf-model="#model-05" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="4" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 6：targetIndex 5 ========== -->
    <a-entity id="anchor-5" mindar-image-target="targetIndex: 5">
      <a-entity id="modelwrap-5" gltf-model="#model-06" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="5" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 7：targetIndex 6 ========== -->
    <a-entity id="anchor-6" mindar-image-target="targetIndex: 6">
      <a-entity id="modelwrap-6" gltf-model="#model-07" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="6" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 8：targetIndex 7 ========== -->
    <a-entity id="anchor-7" mindar-image-target="targetIndex: 7">
      <a-entity id="modelwrap-7" gltf-model="#model-08" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="7" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 9：targetIndex 8 ========== -->
    <a-entity id="anchor-8" mindar-image-target="targetIndex: 8">
      <a-entity id="modelwrap-8" gltf-model="#model-09" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="8" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 10：targetIndex 9 ========== -->
    <a-entity id="anchor-9" mindar-image-target="targetIndex: 9">
      <a-entity id="modelwrap-9" gltf-model="#model-10" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="9" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 11：targetIndex 10 ========== -->
    <a-entity id="anchor-10" mindar-image-target="targetIndex: 10">
      <a-entity id="modelwrap-10" gltf-model="#model-11" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="10" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 12：targetIndex 11 ========== -->
    <a-entity id="anchor-11" mindar-image-target="targetIndex: 11">
      <a-entity id="modelwrap-11" gltf-model="#model-12" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="11" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

    <!-- ========== 产品 13：targetIndex 12 ========== -->
    <a-entity id="anchor-12" mindar-image-target="targetIndex: 12">
      <a-entity id="modelwrap-12" gltf-model="#model-13" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="12" class="clickable">
        <a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    // ============================================================
    // ★ v1.8.1 上传模式：在 MindAR 启动前覆写 getUserMedia
    // 核心原理：upload=1 时，用 Promise 让 MindAR 等待用户选文件
    // ============================================================
    const _isUpload = new URLSearchParams(location.search).get('upload') === '1';
    const _fileInput = document.getElementById('file-input');
    const _btnUpload = document.getElementById('btn-upload');

    if (_isUpload) {
      // v1.9.1 上传模式：不走 MindAR，直接跳转到 viewer.html 带上传参数
      location.href = './viewer.html?upload=1';
    } else {
      // 正常模式：点击上传按钮 → 跳转到上传模式
      _btnUpload.addEventListener('click', () => location.href = './ar.html?upload=1');
    }

    // ============================================================
    // ★★★ v1.6 产品信息配置区 ★★★
    //
    // 杰哥往这里填文案就行，格式说明：
    //   name  —— 产品名（面板大标题）
    //   tag   —— 主题标签（产品名下面的小胶囊，如「古建·辽金」）
    //   brief —— 一句话简介（面板默认显示）
    //   desc  —— 详细介绍（点「查看更多」展开）
    //   voice —— 兜底语音文案（没有对应 MP3 时，用浏览器 TTS 朗读这段）
    //
    // ★ 语音文件（推荐）：把录制好的 MP3 放到 assets/audio/ 文件夹，
    //   命名 audio_01.mp3 ~ audio_13.mp3（编号 = 产品编号），
    //   微信内置浏览器也能正常播放。没有 MP3 时自动降级用浏览器朗读。
    //
    // 注意：顺序必须和 targets.mind 里的图片顺序一致！
    // ============================================================
    const PRODUCT_INFO = [
      { name: '大同积木字', tag: '古都 · 云冈',
        brief: '北魏平城古都，云冈石窟佛韵，105块积木拼出「大同」。',
        desc: '以北魏都城平城为原型，105颗积木以白、橙、黄三色拼出「大同」二字。大同是北魏京华、辽金陪都，云冈石窟在此开凿，五万余尊造像跨越一千五百年。左上一颗红圆片如朝霞，映照古都辉煌。可直立摆放，亦可作镇纸。',
        voice: '您看到的是「大同」积木字。大同，古称平城，是北魏王朝的都城。云冈石窟在这里开凿，五万余尊造像见证了千年的信仰与艺术。一百零五块积木，以白、橙、黄三色拼出「大同」二字，左上的红圆片如一轮朝霞，映照这座古都的千年辉煌。' },
      { name: '关帝庙积木字', tag: '古建 · 信义',
        brief: '关公故里解州关帝庙，159块积木绿底白字匾额。',
        desc: '取解州关帝庙匾额之意，159颗积木绿底白字拼出「关帝庙」，右上嵌「解州」朱红小印。解州关帝庙始建於隋，是全国面积最大的关帝庙，关羽故里所在，忠义文化由此远播四海。可直立摆放。',
        voice: '您看到的是「关帝庙」积木字。解州关帝庙，始建於隋朝，是全国面积最大的关帝庙，也是关羽的故里。一百五十九块积木，以绿底白字再现匾额风韵，右上的「解州」朱红小印，点明关公故里所在。忠义精神，千年传承。' },
      { name: '介休积木字', tag: '琉璃 · 后土',

    const TOTAL = 13;         // ← 改这里：你有几款产品就写几

    let panelTarget = -1;     // 当前面板显示的是哪个产品
    let voicePlaying = false;

    function showPanel(i) {
      const p = PRODUCT_INFO[i] || { name: '产品 ' + (i + 1), tag: '', brief: '', desc: '', voice: '' };
      panelTarget = i;
      pName.textContent = p.name;
      pTag.textContent = p.tag;
      pBrief.textContent = p.brief;
      pDesc.textContent = p.desc;
      pDesc.classList.remove('show');
      btnMore.textContent = '查看更多 ⌄';
      panel.classList.add('show');
      deco.classList.add('show');
      hint.style.opacity = '0';      // 面板出现时隐藏底部提示条，避免重叠
    }

    function hidePanel() {
      panelTarget = -1;
      panel.classList.remove('show');
      deco.classList.remove('show');
      stopVoice();
      hint.style.opacity = '1';
    }

    // ---- 语音播报：MP3 文件优先（微信可用），浏览器 TTS 兜底 ----
    let audioEl = null;        // HTML5 Audio 实例
    let fallbackDone = false;  // 是否已尝试过 TTS 兜底（防止重复触发）

    function stopVoice() {
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '🔊 语音介绍';
      if (audioEl) {
        try { audioEl.pause(); audioEl.currentTime = 0; } catch (e) {}
        audioEl = null;
      }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    }

    // MP3 加载/播放失败时：尝试浏览器 TTS；微信里 TTS 也不可用则提示
    function fallbackTTS(text) {
      if (fallbackDone) return;
      fallbackDone = true;
      if ('speechSynthesis' in window) {
        try {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN';
          u.rate = 0.95;      // 语速稍慢，播报更从容
          u.onend = () => stopVoice();
          u.onerror = () => stopVoice();
          window.speechSynthesis.cancel();   // 先清掉可能残留的任务
          window.speechSynthesis.speak(u);
          return;   // TTS 接管成功，保持播放状态
        } catch (e) {}
      }
      // 到这一步说明 MP3 和 TTS 都不可用（典型：微信内置浏览器）
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '⚠️ 语音文件未配置';
      setTimeout(() => { btnVoice.textContent = '🔊 语音介绍'; }, 2500);
    }

    btnVoice.addEventListener('click', () => {
      if (voicePlaying) { stopVoice(); return; }      // 播放中点击 = 停止
      const p = PRODUCT_INFO[panelTarget];
      if (!p || !p.voice) return;

      // 优先播 assets/audio/audio_NN.mp3（点击即用户手势，微信允许播放）
      const nn = String(panelTarget + 1).padStart(2, '0');
      fallbackDone = false;
      voicePlaying = true;
      btnVoice.classList.add('playing');
      btnVoice.textContent = '⏹ 停止播放';

      audioEl = new Audio('./assets/audio/audio_' + nn + '.mp3');
      audioEl.onended = () => stopVoice();
      audioEl.onerror = () => fallbackTTS(p.voice);
      audioEl.play().catch(() => {
        // play() 被拒（非 404 场景）也走兜底；404 时 onerror 已处理
        if (audioEl) fallbackTTS(p.voice);
      });
    });

    btnMore.addEventListener('click', () => {

      if (navigator.share) {
        try {
          await navigator.share({ title: shareTitle, text: shareText, url: shareUrl });

        } catch (e) { /* 用户取消，不提示 */ }
      }
      // 兜底：复制链接到剪贴板
      try {
        await navigator.clipboard.writeText(shareUrl);
        btnShare.textContent = '✅ 链接已复制';
        setTimeout(() => { btnShare.textContent = '📸 分享'; }, 2000);
      } catch (e) {
        btnShare.textContent = '⚠️ 请手动分享';
        setTimeout(() => { btnShare.textContent = '📸 分享'; }, 2000);

    (function buildDeco() {
      // 四色积木：晋韵金 / 三晋红 / 汾河青 / 黄土橙
      const colors = ['#d4a24e', '#b3473a', '#4a7d8c', '#c77b3b'];

          '<circle cx="45" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="17" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '<circle cx="43" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +

    window.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('hidden'), 3000);
    });

    // ============================================================
    // v1.9 多目标同时追踪 + 独立锁定 + 点击交互
    // ============================================================
    let locked = false;
    const activeTargets = new Set();   // 当前正在识别中的所有目标
    const placedTargets = new Set();   // 被锁定到屏幕上的所有目标
    const foundOnce = new Set();       // 是否曾识别到过

    const anchors = [], modelwraps = [];
    for (let i = 0; i < TOTAL; i++) {
      anchors[i] = document.getElementById('anchor-' + i);
      modelwraps[i] = document.getElementById('modelwrap-' + i);
    }

    const HOME_POS = { x: 0, y: -0.1, z: 0 };
    const HOME_SCALE = { x: 0.8, y: 0.8, z: 0.8 };
    const wp = new THREE.Vector3(), wq = new THREE.Quaternion(), ws = new THREE.Vector3();

    function detachModel(idx) {
      const m = modelwraps[idx];
      if (!m || !m.object3D) return;
      const o = m.object3D;
      if (o.parent === sceneEl.object3D) return;
      o.getWorldPosition(wp); o.getWorldQuaternion(wq); o.getWorldScale(ws);
      sceneEl.object3D.add(o);
      o.position.copy(wp); o.quaternion.copy(wq); o.scale.copy(ws);
      o.visible = true;
    }

    function attachModel(idx) {
      const m = modelwraps[idx];
      if (!m || !m.object3D) return;
      const o = m.object3D;
      if (o.parent === anchors[idx].object3D) return;
      anchors[idx].object3D.add(o);
      o.position.set(HOME_POS.x, HOME_POS.y, HOME_POS.z);
      o.quaternion.identity();
      o.scale.set(HOME_SCALE.x, HOME_SCALE.y, HOME_SCALE.z);
    }

    function getActiveList() {
      return [...activeTargets].sort((a, b) => a - b);
    }

    function updateHintMulti() {
      const list = getActiveList();
      if (list.length === 0) {
        if (placedTargets.size === 0) {
          hint.textContent = '📷 将手机摄像头对准任意产品图';
          hint.classList.remove('tracked', 'locked');
        } else {
          hint.textContent = '🔒 已锁定 ' + placedTargets.size + ' 个模型：单指旋转 · 双指缩放';
          hint.classList.add('locked'); hint.classList.remove('tracked');
        }
      } else {
        const names = list.map(i => (PRODUCT_INFO[i] && PRODUCT_INFO[i].name) || ('产品 ' + (i + 1)));
        if (locked) {
          hint.textContent = '🔒 已识别 ' + list.length + ' 款：' + names.join('、') + '（已锁定）';
          hint.classList.add('locked'); hint.classList.remove('tracked');
        } else {
          hint.textContent = '✅ 已识别「' + names.join('、') + '」';
          hint.classList.add('tracked'); hint.classList.remove('locked');
        }
      }
    }

    // v1.9: 点击模型弹面板（onClick）
    function setupClickInteraction() {

      if (!cursorEl) return;
      cursorEl.addEventListener('click', (e) => {
        const target = e.detail && e.detail.intersectedEl;
        if (!target) return;
        const idx = parseInt(target.getAttribute('data-idx'));
        if (isNaN(idx) || idx < 0 || idx >= TOTAL) return;
        stopVoice();
        showPanel(idx);
      });
      // 电脑端鼠标点击也支持
      document.addEventListener('click', (e) => {
        if (e.target.closest && (e.target.closest('#panel') || e.target.closest('#bar') || e.target.closest('a-cursor'))) return;
        // raycaster click 已由 cursor 处理，这里只处理非 AR 区域
      });
    }

    // 给每个锚点绑定事件（v1.9 多目标独立）
    for (let i = 0; i < TOTAL; i++) {
      anchors[i].addEventListener('targetFound', () => {
        activeTargets.add(i);
        foundOnce.add(i);

        // v1.6：识别到产品 → 弹出信息面板（多目标时显示最新识别的）+ 停上一段语音
        stopVoice();
        showPanel(i);

        if (locked) {
          detachModel(i);
          placedTargets.add(i);
        }

        updateHintMulti();
      });

      anchors[i].addEventListener('targetLost', () => {
        activeTargets.delete(i);

        if (locked && foundOnce.has(i)) {
          // 锁定模式：模型已 detach，保持在屏幕上
          // 面板：如果还有其他活跃目标，切到下一个；否则保留当前面板
          const remaining = getActiveList();
          if (remaining.length > 0) {
            showPanel(remaining[remaining.length - 1]);
          }
          // 面板不收起，模型不收回
        } else {
          // 非锁定模式：面板切到下一个活跃目标，没有就收起
          const remaining = getActiveList();
          if (remaining.length > 0) {
            showPanel(remaining[remaining.length - 1]);
          } else {
            hidePanel();
          }
        }

        updateHintMulti();
      });
    }

    // 锁定开关（v1.9 多目标版）
    btnLock.addEventListener('click', () => {
      locked = !locked;
      btnLock.textContent = locked ? '🔒 已锁定（点此解锁）' : '🔓 锁定（移开图不消失）';
      btnLock.classList.toggle('on', locked);

      if (locked) {
        // 锁定：把所有当前活跃的模型 detach 到屏幕
        activeTargets.forEach(i => {
          detachModel(i);
          placedTargets.add(i);
        });
      } else {
        // 解锁：把所有 placed 的模型收回锚点
        placedTargets.forEach(i => attachModel(i));
        placedTargets.clear();
        // 解锁且当前没有识别到目标 → 面板收起
        if (activeTargets.size === 0) hidePanel();
      }
      updateHintMulti();
    });

    // v1.9: 初始化点击交互
    setupClickInteraction();

    // ============================================================
    // v1.9 手势：单指滑动 = 360° 旋转；双指捏合 = 缩放
    // 对所有 placedTargets（锁定在屏幕上的模型）同时生效
    // ============================================================
    let tLast = null, pinchLast = 0;
    function touchDist(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.hypot(dx, dy);
    }
    // 鼠标拖动支持（电脑/平板看效果）
    let mouseDrag = false, mouseLast = null;
    document.addEventListener('mousedown', (e) => {
      if (placedTargets.size === 0) return;
      if (e.target.closest && (e.target.closest('#panel') || e.target.closest('#bar'))) return;
      mouseDrag = true;
      mouseLast = { x: e.clientX, y: e.clientY };
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseDrag || placedTargets.size === 0) return;
      if (!mouseLast) return;
      const dx = e.clientX - mouseLast.x;
      const dy = e.clientY - mouseLast.y;
      placedTargets.forEach(i => {
        const o = modelwraps[i] && modelwraps[i].object3D;
        if (!o) return;
        o.rotation.y += dx * 0.01;
        o.rotation.x += dy * 0.01;
      });
      mouseLast = { x: e.clientX, y: e.clientY };
    });
    document.addEventListener('mouseup', () => { mouseDrag = false; mouseLast = null; });

    document.addEventListener('touchstart', (e) => {
      if (placedTargets.size === 0) return;
      if (e.target.closest && e.target.closest('#panel')) return;
      if (e.touches.length === 1) tLast = {
        x: e.touches[0].clientX,
        y: e.touches[0].clientY
      };
      if (e.touches.length === 2) pinchLast = touchDist(e);
    }, { passive: true });
    document.addEventListener('touchmove', (e) => {
      if (placedTargets.size === 0) return;
      if (e.target.closest && e.target.closest('#panel')) return;
      if (e.touches.length === 1 && tLast !== null) {
        const dx = e.touches[0].clientX - tLast.x;
        const dy = e.touches[0].clientY - tLast.y;
        placedTargets.forEach(i => {
          const o = modelwraps[i] && modelwraps[i].object3D;
          if (!o) return;
          o.rotation.y += dx * 0.01;
          o.rotation.x += dy * 0.01;
        });
        tLast = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      } else if (e.touches.length === 2 && pinchLast > 0) {
        const d = touchDist(e);
        const ratio = d / pinchLast;
        placedTargets.forEach(i => {
          const o = modelwraps[i] && modelwraps[i].object3D;
          if (!o) return;
          const k = Math.min(3, Math.max(0.2, o.scale.x * ratio));
          o.scale.setScalar(k);
        });
        pinchLast = d;
      }
    }, { passive: true });
    document.addEventListener('touchend', () => { tLast = null; pinchLast = 0; }, { passive: true });
  </script>

</body>
</html>
