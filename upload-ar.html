<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>北韵晋创 · 上传图片AR识别</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: "PingFang SC","Microsoft YaHei",sans-serif; background: #000; }

    #upload-ui {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0e1116 0%, #1a2030 50%, #0e1116 100%);
      padding: 20px;
    }
    #upload-ui .logo {
      width: 120px; margin-bottom: 20px;
      background: rgba(245,240,230,0.95); border-radius: 14px; padding: 8px 12px;
      box-shadow: 0 6px 32px rgba(212,162,78,0.2);
    }
    #upload-ui .logo img { width: 100%; display: block; }
    #upload-ui h2 { color: #e8e2d4; font-size: 20px; margin-bottom: 8px; font-weight: 600; }
    #upload-ui p { color: #8a9099; font-size: 13px; margin-bottom: 24px; text-align: center; max-width: 280px; line-height: 1.6; }
    #upload-ui .pick-btn {
      background: #d4a24e; color: #101418; border: none;
      padding: 16px 40px; border-radius: 999px; font-size: 18px; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 20px rgba(212,162,78,0.4);
    }
    #upload-ui .pick-btn:active { transform: scale(0.96); }
    #upload-ui .back-link { margin-top: 20px; color: #8a9099; font-size: 14px; text-decoration: none; }

    #loading {
      position: fixed; inset: 0; z-index: 150;
      background: linear-gradient(160deg, #0e1116 0%, #1a2030 50%, #0e1116 100%);
      color: #e8e2d4; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.4s;
    }
    #loading.show { display: flex; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading .load-bricks { display: flex; gap: 6px; margin-bottom: 16px; }
    #loading .load-bricks span { display: block; width: 12px; height: 12px; border-radius: 3px; animation: brickJump 1.2s ease-in-out infinite; }
    #loading .load-bricks span:nth-child(1) { background: #d4a24e; animation-delay: 0s; }
    #loading .load-bricks span:nth-child(2) { background: #c8392e; animation-delay: 0.15s; }
    #loading .load-bricks span:nth-child(3) { background: #2a6e3f; animation-delay: 0.3s; }
    #loading .load-bricks span:nth-child(4) { background: #1e5b8a; animation-delay: 0.45s; }
    #loading .load-bricks span:nth-child(5) { background: #e8c878; animation-delay: 0.6s; }
    @keyframes brickJump { 0%,100% { transform: translateY(0); } 40%,60% { transform: translateY(-14px); } }
    #loading .load-text { font-size: 15px; letter-spacing: 3px; color: #d4a24e; animation: textPulse 1.5s ease-in-out infinite; }
    @keyframes textPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    #bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 60;
      display: flex; gap: 6px; padding: 10px 10px 0; justify-content: center; flex-wrap: nowrap;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #bar::-webkit-scrollbar { display: none; }
    #bar a, #bar button {
      flex-shrink: 0; background: rgba(30,38,46,0.92); color: #e8e2d4;
      border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 999px;
      font-size: 13px; text-decoration: none; cursor: pointer; backdrop-filter: blur(6px); white-space: nowrap;
    }
    #bar a:active, #bar button:active { background: #d4a24e; color: #101418; }

    #hint {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(16,20,24,0.85); color: #fff;
      padding: 8px 16px; border-radius: 999px; font-size: 13px; z-index: 50;
      max-width: 92%; text-align: center; transition: opacity 0.3s;
    }
    #hint.tracked { background: rgba(200,57,46,0.92); }
    #hint.error { background: rgba(200,57,46,0.92); }

    #panel {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 55;
      background: linear-gradient(0deg, rgba(14,17,22,0.97) 80%, transparent);
      color: #e8e2d4; padding: 8px 16px calc(12px + env(safe-area-inset-bottom));
      transform: translateY(110%); transition: transform 0.35s ease;
      max-height: 55vh; overflow-y: auto;
    }
    #panel.show { transform: translateY(0); }
    #panel .grabber { width: 40px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; margin: 0 auto 8px; }
    #panel .p-brand { font-size: 11px; letter-spacing: 4px; color: #d4a24e; text-align: center; margin-bottom: 2px; }
    #panel .p-name { font-size: 18px; font-weight: 600; text-align: center; margin-bottom: 2px; }
    #panel .p-tag { font-size: 12px; color: #d4a24e; text-align: center; margin-bottom: 6px; }
    #panel .p-tag:empty { display: none; }
    #panel .p-brief { font-size: 13px; color: #c8cdd4; line-height: 1.75; text-align: justify; margin-bottom: 6px; }
    #panel .p-desc { font-size: 13px; color: #9aa2ab; line-height: 1.75; text-align: justify; display: none; border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 8px; margin-top: 4px; }
    #panel .p-desc.show { display: block; }
    #panel .p-btns { display: flex; gap: 10px; margin-top: 10px; justify-content: center; }
    #panel .p-btns button { flex: 1; max-width: 200px; background: rgba(212,162,78,0.16); color: #d4a24e; border: 1px solid rgba(212,162,78,0.5); padding: 10px 12px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
    #panel .p-btns button:active { background: #d4a24e; color: #101418; }
    #panel .p-btns button.playing { background: #d4a24e; color: #101418; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(212,162,78,0.5); } 50% { box-shadow: 0 0 0 8px rgba(212,162,78,0); } }

    .logo-badge {
      position: fixed; bottom: 16px; right: 16px; z-index: 55;
      background: rgba(245,240,230,0.92); border-radius: 10px; padding: 4px 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3); pointer-events: none;
      max-width: 90px; opacity: 0.7;
    }
    .logo-badge img { width: 100%; display: block; }

    #deco { position: fixed; inset: 0; z-index: 40; pointer-events: none; overflow: hidden; opacity: 0; transition: opacity 1.2s; }
    #deco.show { opacity: 1; }
    #deco .brick { position: absolute; bottom: -60px; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 8% { opacity: 0.28; } 85% { opacity: 0.28; } 100% { transform: translateY(-115vh) rotate(340deg); opacity: 0; } }

    .a-enter-vr, .a-orientation-modal { display: none !important; }
  </style>
</head>
<body>

  <!-- 上传界面 -->
  <div id="upload-ui">
    <div class="logo"><img src="./assets/logo.png" alt="北韵晋创"></div>
    <h2>🖼 上传图片AR识别</h2>
    <p>拍一张产品卡片照片或从相册选择，系统将自动扫描识别并展示AR效果</p>
    <button class="pick-btn" id="pick-btn">🖼 点击选择图片</button>
    <a href="./index.html" class="back-link">← 返回首页</a>
  </div>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <!-- 分析中加载界面 -->
  <div id="loading">
    <div class="load-bricks"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="load-text" id="load-text">正在扫描识别…</div>
  </div>

  <!-- 顶部操作条 -->
  <div id="bar" style="display:none;">
    <a href="./index.html">🏠 首页</a>
    <button id="btn-reupload">🖼 重新上传</button>
    <a href="./ar.html">📷 摄像头扫描</a>
    <a href="./viewer.html">🖥 3D查看</a>
  </div>

  <!-- 提示条 -->
  <div id="hint" style="display:none;">正在扫描图片中的产品…</div>

  <!-- 产品信息面板 -->
  <div id="panel">
    <div class="grabber"></div>
    <div class="p-brand">北 韵 晋 创 · 文 化 积 木</div>
    <div class="p-name" id="p-name">产品名称</div>
    <div class="p-tag" id="p-tag">主题标签</div>
    <div class="p-brief" id="p-brief">产品简介</div>
    <div class="p-desc" id="p-desc">详细介绍</div>
    <div class="p-btns">
      <button id="btn-voice">🔊 语音介绍</button>
      <button id="btn-share">📸 分享</button>
      <button id="btn-more">查看更多 ⌄</button>
    </div>
  </div>

  <!-- 积木装饰 -->
  <div id="deco" aria-hidden="true"></div>

  <!-- Logo水印 -->
  <div class="logo-badge" id="logo-badge" style="display:none;"><img src="./assets/logo.png" alt="北韵晋创"></div>

  <!-- 隐藏canvas用于生成视频流 -->
  <canvas id="img-canvas" style="display:none;"></canvas>

  <!-- A-Frame场景容器（动态创建） -->
  <div id="scene-host"></div>

  <script>
    // ============================================================
    // 产品信息（与 ar.html 保持一致）
    // ============================================================
    const PRODUCT_INFO = [
      { name: '大同积木字', tag: '古都 · 云冈',
        brief: '北魏平城古都，云冈石窟佛韵，105块积木拼出「大同」。',
        desc: '以北魏都城平城为原型，105颗积木以白、橙、黄三色拼出「大同」二字。大同是北魏京华、辽金陪都，云冈石窟在此开凿，五万余尊造像跨越一千五百年。左上一颗红圆片如朝霞，映照古都辉煌。可直立摆放，亦可作镇纸。',
        voice: '您看到的是「大同」积木字。大同，古称平城，是北魏王朝的都城。云冈石窟在这里开凿，五万余尊造像见证了千年的信仰与艺术。一百零五块积木，以白、橙、黄三色拼出「大同」二字，左上的红圆片如一轮朝霞，映照这座古都的千年辉煌。' },
      { name: '关帝庙积木字', tag: '古建 · 信义',
        brief: '关公故里解州关帝庙，159块积木绿底白字匾额。',
        desc: '取解州关帝庙匾额之意，159颗积木绿底白字拼出「关帝庙」，右上嵌「解州」朱红小印。解州关帝庙始建於隋，是全国面积最大的关帝庙，关羽故里所在，忠义文化由此远播四海。可直立摆放。',
        voice: '您看到的是「关帝庙」积木字。解州关帝庙，始建於隋朝，是全国面积最大的关帝庙，也是关羽的故里。一百五十九块积木，以绿底白字再现匾额风韵，右上的「解州」朱红小印，点明关公故里所在。忠义精神，千年传承。' },
      { name: '介休积木字', tag: '琉璃 · 后土',
        brief: '琉璃之乡介休，后土庙脊饰入积木，109块拼出「介休」。',
        desc: '取介休琉璃脊饰之意，109颗积木橙黄底拼出「介休」二字，左上红圆点如琉璃珠。介休自古以琉璃烧制闻名，后土庙琉璃影壁与脊饰冠绝三晋，被誉为「中国琉璃艺术宝库」。可直立摆放。',
        voice: '您看到的是「介休」积木字。介休，自古以琉璃烧制闻名，后土庙的琉璃影壁和脊饰冠绝三晋，被誉为中国琉璃艺术宝库。一百零九块积木，橙黄底白字拼出「介休」，左上的红圆点如一颗琉璃珠，折射千年窑火的光芒。' },
      { name: '晋祠积木字', tag: '古建 · 宋韵',
        brief: '千年古祠晋祠，圣母殿宋代遗构，149块积木绿底金字。',
        desc: '以晋祠匾额为原型，149颗积木绿底金字拼出「晋祠」，顶上红圆片如圣母殿红墙。晋祠始建於北魏，圣母殿为宋代建筑典范，鱼沼飞梁十字桥为海内孤例，周柏唐槐诉说千年。可直立摆放。',
        voice: '您看到的是「晋祠」积木字。晋祠始建於北魏，圣母殿是宋代建筑的典范，鱼沼飞梁十字桥为海内孤例，周柏唐槐诉说千年沧桑。一百四十九块积木，绿底金字拼出「晋祠」，顶上的红圆片如圣母殿的红墙。' },
      { name: '临汾积木字', tag: '表里 · 汾河',
        brief: '尧都临汾，汾河穿城，172块积木拼出表里山河。',
        desc: '取「表里山河」之意，172颗积木橙底白字拼出「临汾」，红圆点如汾河鼓灯。临汾古称平阳，传为尧帝故都，汾河穿城而过。这里是华夏文明发源地之一，丁村人遗址、陶寺观象台在此发现。可直立摆放。',
        voice: '您看到的是「临汾」积木字。临汾，古称平阳，传为尧帝的故都，汾河穿城而过。这里是华夏文明发源地之一，丁村人遗址和陶寺观象台都在这里被发现。一百七十二块积木，橙底白字拼出「临汾」，红圆点如汾河岸边的鼓灯。' },
      { name: '魁星楼冰箱贴', tag: '古建 · 文运',
        brief: '晋祠魁星楼，三层飞檐文运之星，100块积木磁吸贴。',

        voice: '您看到的是魁星楼冰箱贴。魁星，是主管文运的星君，古时学子赴考前常拜魁星阁，祈愿金榜题名。这款冰箱贴仿晋祠魁星阁造型，一百块积木拼出三层飞檐小楼，顶上金黄宝珠，磁吸底座可贴於冰箱，寓意文运随身。' },
      { name: '水镜台冰箱贴', tag: '古建 · 梨园',
        brief: '解州关帝庙水镜台古戏台，42块积木黄檐双鼓。',

      { name: '地铁一号线', tag: '太原 · Line 1',
        brief: '太原地铁1号线站牌柱，A出口太原站，59块积木。',
        desc: '59颗积木拼出26厘米高黄色站牌柱，还原太原地铁1号线入口标识。标志为太原地铁Logo，标注A出口·山西省太原站·Line 1。太原地铁1号线连接太原站与河西片区，是山西城市现代化的缩影。可直立摆放。',
        voice: '您看到的是地铁一号线积木。太原地铁1号线连接太原站与河西片区，是山西城市现代化的缩影。五十九块积木拼出黄色站牌立柱，还原1号线入口标识——A出口·山西省太原站·Line 1。' },
      { name: '迎泽大桥冰箱贴', tag: '太原 · 迎泽',
        brief: '迎泽桥主塔造型，三层塔身红色顶灯，95块积木磁吸贴。',

      { name: '迎泽大桥摆件', tag: '太原 · 迎泽',
        brief: '迎泽桥塔放大18厘米桌面摆件，157块积木直立陈列。',

      { name: '迫击炮（升级版）', tag: '军工 · 红色',
        brief: '1:43进阶款，浅绿迫击炮配红星弹药箱，106块积木。',
        desc: '1:43进阶款，106颗积木拼出浅绿迫击炮，扬角更大，木质弹药箱嵌黄边红五角星，黑色底座。以山西军工精神为原型，红星弹药箱寓意革命传承，扬角增大彰显火力升级，红色记忆入积木。',
        voice: '您看到的是迫击炮升级版积木。一百零六块积木，拼出浅绿色迫击炮，扬角更大彰显火力升级。木质弹药箱嵌着黄边红五角星，寓意革命传承。以山西太行山军工精神为原型，红色记忆入积木。' },
      { name: '龙鹤福', tag: '非遗 · 纹样',
        brief: '龙鹤福吉祥纹样摆件，57块积木红黄龙鹤四向延展。',
        desc: '取「龙鹤福」吉祥纹样，57颗积木拼出中心红圆主纹，四向延伸红黄龙鹤件，直径约12厘米。龙鹤福是山西民间剪纸与窗花中的经典纹样，将龙、鹤与福字融为一体，寓意龙翔鹤舞、福寿双全。可壁挂或平放。',
        voice: '您看到的是龙鹤福摆件。龙鹤福是山西民间剪纸与窗花中的经典纹样，将龙、鹤与福字融为一体，寓意龙翔鹤舞、福寿双全。五十七块积木，中心红圆主纹，四向延伸红黄龙鹤，直径约十二厘米，可壁挂或平放。' },
    ];

    const TOTAL = 13;
    const uploadUI = document.getElementById('upload-ui');
    const loading = document.getElementById('loading');
    const loadText = document.getElementById('load-text');
    const fileInput = document.getElementById('file-input');
    const pickBtn = document.getElementById('pick-btn');
    const bar = document.getElementById('bar');
    const hint = document.getElementById('hint');
    const panel = document.getElementById('panel');
    const deco = document.getElementById('deco');
    const logoBadge = document.getElementById('logo-badge');
    const sceneHost = document.getElementById('scene-host');
    const imgCanvas = document.getElementById('img-canvas');

    let sceneEl = null;
    let sceneReady = false;
    let activeTargets = new Set();
    let foundOnce = new Set();
    let panelTarget = -1;
    let voicePlaying = false;
    let audioEl = null;
    let fallbackDone = false;
    let scanTimeout = null;

    const pName = document.getElementById('p-name');
    const pTag = document.getElementById('p-tag');
    const pBrief = document.getElementById('p-brief');
    const pDesc = document.getElementById('p-desc');
    const btnVoice = document.getElementById('btn-voice');
    const btnMore = document.getElementById('btn-more');
    const btnShare = document.getElementById('btn-share');

    // ============================================================
    // 1. 用户点击按钮选择图片（必须在用户手势中触发文件选择器）
    // ============================================================
    pickBtn.addEventListener('click', function() {
      fileInput.click();
    });

    // ============================================================
    // 2. 文件选择后：创建canvas视频流 → 覆写getUserMedia → 动态创建MindAR场景
    // ============================================================
    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      // 隐藏上传界面，显示加载
      uploadUI.style.display = 'none';
      loading.classList.add('show');
      loadText.textContent = '正在加载图片…';

      const img = new Image();
      img.onload = function() {
        // 将图片绘制到canvas，尺寸适配MindAR期望的1280x960
        const cw = 1280, ch = 960;
        imgCanvas.width = cw;
        imgCanvas.height = ch;
        const ctx = imgCanvas.getContext('2d');

        // 居中绘制，保持宽高比
        const scale = Math.max(cw / img.width, ch / img.height);
        const dw = img.width * scale;
        const dh = img.height * scale;
        const dx = (cw - dw) / 2;
        const dy = (ch - dh) / 2;

        function drawFrame() {
          ctx.fillStyle = '#000';
          ctx.fillRect(0, 0, cw, ch);
          ctx.drawImage(img, dx, dy, dw, dh);
          requestAnimationFrame(drawFrame);
        }
        drawFrame();

        // 获取canvas视频流
        let stream = null;
        try {
          stream = imgCanvas.captureStream(30);
        } catch (err) {
          loadText.textContent = '浏览器不支持图片扫描，请用摄像头扫描';
          hint.style.display = 'block';
          hint.textContent = '⚠️ 当前浏览器不支持图片扫描，请使用摄像头扫描模式';
          hint.classList.add('error');
          loading.classList.remove('show');
          bar.style.display = 'flex';
          return;
        }

        loadText.textContent = '正在扫描识别…';

        // 覆写 getUserMedia —— MindAR 会调用这个方法获取视频流
        navigator.mediaDevices.getUserMedia = async function(constraints) {
          return stream;
        };

        // 显示UI元素
        bar.style.display = 'flex';
        hint.style.display = 'block';
        hint.textContent = '🔍 正在扫描图片中的产品…';
        logoBadge.style.display = 'block';

        // 重新上传按钮
        document.getElementById('btn-reupload').addEventListener('click', function() {
          location.reload();
        });

        // 动态创建 A-Frame 场景
        createScene();
      };
      img.src = URL.createObjectURL(file);
    });

    // ============================================================
    // 3. 动态创建 MindAR A-Frame 场景
    // ============================================================
    function createScene() {
      // 构建场景HTML
      let sceneHTML = '<a-scene mindar-image="imageTargetSrc: ./assets/targets.mind; maxTrack: 3; filterMinCF: 0.1; filterBeta: 10" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" loading-screen="enabled: false" embedded>';

      sceneHTML += '<a-camera position="0 0 0" look-controls="enabled: false">';
      sceneHTML += '<a-cursor fuse="false" raycaster="objects: [data-clickable]; far: 10000" id="cursor" visible="true" material="color: #d4a24e; shader: flat" geometry="radiusInner: 0.005; radiusOuter: 0.01; segments: 24; primitive: ring" position="0 0 -1" scale="2 2 2"></a-cursor>';
      sceneHTML += '</a-camera>';

      // 13个产品锚点
      for (var i = 0; i < TOTAL; i++) {
        sceneHTML += '<a-entity id="anchor-' + i + '" mindar-image-target="targetIndex: ' + i + '">';
        sceneHTML += '<a-entity id="modelwrap-' + i + '" gltf-model="url(./assets/model_' + String(i+1).padStart(2,'0') + '.glb)" scale="0.8 0.8 0.8" position="0 -0.1 0" data-clickable data-idx="' + i + '" class="clickable">';
        sceneHTML += '<a-animation attribute="rotation" from="0 0 0" to="0 360 0" dur="16000" repeat="indefinite" easing="linear"></a-animation>';
        sceneHTML += '</a-entity>';
        sceneHTML += '</a-entity>';
      }

      sceneHTML += '</a-scene>';

      sceneHost.innerHTML = sceneHTML;
      sceneEl = sceneHost.querySelector('a-scene');

      // 场景加载完成
      sceneEl.addEventListener('loaded', function() {
        sceneReady = true;
      });

      // MindAR 就绪
      sceneEl.addEventListener('arready', function() {
        loading.classList.remove('show');
        hint.textContent = '🔍 MindAR已就绪，正在扫描图片…';
        setupTargetEvents();

        // 15秒超时：如果没识别到任何产品
        scanTimeout = setTimeout(function() {
          if (foundOnce.size === 0) {
            hint.textContent = '⚠️ 未识别到产品，请换一张更清晰的产品图片，或使用摄像头扫描';
            hint.classList.add('error');
          }
        }, 15000);
      });

      // 兜底：8秒后强制隐藏加载界面
      setTimeout(function() {
        loading.classList.remove('show');
      }, 8000);
    }

    // ============================================================
    // 4. 绑定目标识别事件（与 ar.html 逻辑一致）
    // ============================================================
    function setupTargetEvents() {
      const anchors = [], modelwraps = [];
      for (let i = 0; i < TOTAL; i++) {
        anchors[i] = document.getElementById('anchor-' + i);
        modelwraps[i] = document.getElementById('modelwrap-' + i);

        anchors[i].addEventListener('targetFound', function() {
          activeTargets.add(i);
          foundOnce.add(i);
          if (scanTimeout) { clearTimeout(scanTimeout); scanTimeout = null; }
          stopVoice();
          showPanel(i);
          updateHint();
        });

        anchors[i].addEventListener('targetLost', function() {
          activeTargets.delete(i);
          var remaining = [...activeTargets].sort(function(a,b){return a-b;});
          if (remaining.length > 0) {
            showPanel(remaining[remaining.length - 1]);
          } else {
            hidePanel();
          }
          updateHint();
        });
      }

      // 点击模型弹面板
      var cursorEl = document.getElementById('cursor');
      if (cursorEl) {
        cursorEl.addEventListener('click', function(e) {
          var target = e.detail && e.detail.intersectedEl;
          if (!target) return;
          var idx = parseInt(target.getAttribute('data-idx'));
          if (!isNaN(idx) && idx >= 0 && idx < TOTAL) {
            stopVoice();
            showPanel(idx);
          }
        });
      }
    }

    // ============================================================
    // 5. 信息面板 + 提示
    // ============================================================
    function showPanel(i) {
      var p = PRODUCT_INFO[i] || { name: '产品 ' + (i + 1), tag: '', brief: '', desc: '', voice: '' };
      panelTarget = i;
      pName.textContent = p.name;
      pTag.textContent = p.tag;
      pBrief.textContent = p.brief;
      pDesc.textContent = p.desc;
      pDesc.classList.remove('show');
      btnMore.textContent = '查看更多 ⌄';
      panel.classList.add('show');
      deco.classList.add('show');
      hint.style.opacity = '0';
    }

    function hidePanel() {
      panelTarget = -1;
      panel.classList.remove('show');
      deco.classList.remove('show');
      stopVoice();
      hint.style.opacity = '1';
    }

    function updateHint() {
      var list = [...activeTargets].sort(function(a,b){return a-b;});
      if (list.length === 0) {
        hint.textContent = '🔍 继续扫描或上传新图片';
        hint.classList.remove('tracked');
      } else {
        var names = list.map(function(i) { return PRODUCT_INFO[i] ? PRODUCT_INFO[i].name : ('产品' + (i+1)); });
        hint.textContent = '✅ 已识别「' + names.join('、') + '」';
        hint.classList.add('tracked');
      }
    }

    // ============================================================
    // 6. 语音播报（MP3优先 → TTS兜底）
    // ============================================================
    function stopVoice() {
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '🔊 语音介绍';
      if (audioEl) {
        try { audioEl.pause(); audioEl.currentTime = 0; } catch (e) {}
        audioEl = null;
      }
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {}
    }

    function fallbackTTS(text) {
      if (fallbackDone) return;
      fallbackDone = true;
      if ('speechSynthesis' in window) {
        try {
          var u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN'; u.rate = 0.95;
          u.onend = function() { stopVoice(); };
          u.onerror = function() { stopVoice(); };
          window.speechSynthesis.cancel();
          window.speechSynthesis.speak(u);
          return;
        } catch (e) {}
      }
      voicePlaying = false;
      btnVoice.classList.remove('playing');
      btnVoice.textContent = '⚠️ 语音文件未配置';
      setTimeout(function() { btnVoice.textContent = '🔊 语音介绍'; }, 2500);
    }

    btnVoice.addEventListener('click', function() {
      if (voicePlaying) { stopVoice(); return; }
      var p = PRODUCT_INFO[panelTarget];
      if (!p || !p.voice) return;
      var nn = String(panelTarget + 1).padStart(2, '0');
      fallbackDone = false;
      voicePlaying = true;
      btnVoice.classList.add('playing');
      btnVoice.textContent = '⏹ 停止播放';
      audioEl = new Audio('./assets/audio/audio_' + nn + '.mp3');
      audioEl.onended = function() { stopVoice(); };
      audioEl.onerror = function() { fallbackTTS(p.voice); };
      audioEl.play().catch(function() { if (audioEl) fallbackTTS(p.voice); });
    });

    btnMore.addEventListener('click', function() {
      var open = pDesc.classList.toggle('show');
      btnMore.textContent = open ? '收起介绍 ⌃' : '查看更多 ⌄';
    });

    // ============================================================
    // 7. 分享功能
    // ============================================================
    btnShare.addEventListener('click', async function() {
      var p = PRODUCT_INFO[panelTarget];
      if (!p) return;
      var shareTitle = '北韵晋创 · ' + p.name;
      var shareText = p.brief + ' — 扫图即看AR，一块积木一段三晋文化。';
      var shareUrl = window.location.href;
      if (navigator.share) {
        try { await navigator.share({ title: shareTitle, text: shareText, url: shareUrl }); return; } catch (e) {}
      }
      try { await navigator.clipboard.writeText(shareUrl); btnShare.textContent = '✅ 链接已复制'; setTimeout(function() { btnShare.textContent = '📸 分享'; }, 2000); }
      catch (e) { btnShare.textContent = '⚠️ 请手动分享'; setTimeout(function() { btnShare.textContent = '📸 分享'; }, 2000); }
    });

    // ============================================================
    // 8. 积木装饰
    // ============================================================
    (function buildDeco() {
      var colors = ['#d4a24e', '#b3473a', '#4a7d8c', '#c77b3b'];
      var specs = [
        { left: '6%',  size: 40, dur: 15, delay: 0 },
        { left: '24%', size: 30, dur: 19, delay: 3.5 },
        { left: '46%', size: 48, dur: 13, delay: 1.5 },
        { left: '68%', size: 32, dur: 21, delay: 6 },
        { left: '84%', size: 42, dur: 16, delay: 4 },
        { left: '55%', size: 26, dur: 24, delay: 8 },
      ];
      specs.forEach(function(s, i) {
        var c = colors[i % colors.length];
        var el = document.createElement('div');
        el.className = 'brick';
        el.style.left = s.left;
        el.style.animationDuration = s.dur + 's';
        el.style.animationDelay = s.delay + 's';
        el.innerHTML =
          '<svg width="' + s.size + '" height="' + Math.round(s.size * 0.62) + '" viewBox="0 0 64 40">' +
          '<rect x="1" y="1" width="62" height="38" rx="7" fill="' + c + '" fill-opacity="0.9" stroke="rgba(0,0,0,0.25)" stroke-width="2"/>' +
          '<circle cx="19" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="45" cy="20" r="8" fill="' + c + '" stroke="rgba(0,0,0,0.22)" stroke-width="2"/>' +
          '<circle cx="17" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '<circle cx="43" cy="18" r="2.5" fill="rgba(255,255,255,0.35)"/>' +
          '</svg>';
        deco.appendChild(el);
      });
    })();
  </script>

</body>
